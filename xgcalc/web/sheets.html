<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every NHL game scored shot by shot with a full-data expected-goals model: game sheets, team and player xG, goalie GSAx. Updated after every game.">

<meta name="theme-color" content="#0e0e0e">
<title>Game Sheets &mdash; Luc Knox</title>
</head>
<body>
<style>
/* Game sheets in Inset Dark: tactile, monochrome near-black. Surfaces sit
   down into recessed wells (inset shadows) or rise as gradient pills with
   hairline white borders. Values come from the Inset Dark registry
   (better-design.com/registry/inset-dark/globals.json). Every rule below
   reads a --t-* token; the script builds markup with these class names.
   Departures from the pure-monochrome system: home/away keep team hues and
   good/bad/warn keep status hues, because the data needs them. */
:root{
  /* Surfaces, deepest to highest */
  --t-bg:oklch(0.13 0 0); --t-card:oklch(0.17 0 0); --t-card-2:oklch(0.15 0 0); --t-pop:oklch(0.21 0 0); --t-hover:oklch(0.23 0 0);
  --t-fg:oklch(1 0 0); --t-fg-2:oklch(0.78 0 0); --t-muted:oklch(0.62 0 0); --t-dim:oklch(0.45 0 0);
  --t-line:oklch(1 0 0 / 0.08); --t-line-2:oklch(1 0 0 / 0.14); --t-focus:oklch(1 0 0 / 0.18);
  /* The only accent is a brighter near-white */
  --t-accent:oklch(0.95 0 0); --t-accent-ink:oklch(0.13 0 0);
  /* Data hues */
  --t-home:oklch(0.74 0.12 245); --t-away:oklch(0.72 0.15 28);
  --t-good:oklch(0.76 0.14 150); --t-bad:oklch(0.66 0.19 25); --t-warn:oklch(0.8 0.13 80);
  /* Rink on dark ice */
  --t-ice:oklch(0.19 0 0); --t-paint:oklch(1 0 0 / 0.16); --t-blue:oklch(0.62 0.12 250); --t-red:oklch(0.6 0.17 25);
  --t-board:oklch(1 0 0 / 0.22); --t-ring:oklch(1 0 0);
  /* Type */
  --t-font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --t-font-head:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --t-font-label:var(--t-font-body); --t-font-num:var(--t-font-head);
  --t-head-case:none; --t-head-track:-0.02em; --t-head-weight:650; --t-label-track:0; --t-body-size:14px;
  /* Shape */
  --t-radius:12px; --t-radius-sm:8px; --t-shape:none; --t-h1-fx:none;
  --t-shadow:0 0 0 .5px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.2);
  --t-shadow-pill:0 0 0 .5px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
  --t-shadow-pill-hover:0 0 0 .5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.12), 0 2px 4px rgba(0,0,0,.45), 0 6px 16px rgba(0,0,0,.3);
  --t-shadow-lg:0 0 0 .5px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.1), 0 6px 12px rgba(0,0,0,.55), 0 12px 24px rgba(0,0,0,.35);
  --t-inset:inset 0 1px 2px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.03);
  --t-inset-deep:inset 0 2px 4px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04);
  --t-pill:linear-gradient(180deg, oklch(0.27 0 0) 0%, oklch(0.21 0 0) 100%);
  --t-pill-hover:linear-gradient(180deg, oklch(0.3 0 0) 0%, oklch(0.23 0 0) 100%);
  --t-pressed:0 1px 1px rgba(0,0,0,.5);
  --t-ease:cubic-bezier(0.165, 0.84, 0.44, 1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--t-bg); scrollbar-gutter:stable}
body{margin:0; -webkit-font-smoothing:antialiased; font-family:var(--t-font-body); font-size:var(--t-body-size);
  line-height:1.5; letter-spacing:-0.01em; color:var(--t-fg); background:var(--t-bg)}
h1,h2,h3,p{margin:0}
a{color:var(--t-fg); text-decoration-color:var(--t-line-2); text-underline-offset:3px}
a:hover{text-decoration-color:var(--t-fg)}
::selection{background:oklch(0.27 0 0); color:var(--t-fg)}
:focus-visible{outline:2px solid var(--t-focus); outline-offset:2px}
.wrap{max-width:1180px; margin:0 auto; padding:24px 16px 64px}
.hidden{display:none !important}

/* Masthead */
.mast{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.mast h1{font-family:var(--t-font-head); font-size:30px; font-weight:700; letter-spacing:-0.025em; line-height:1.1}
.mast .sub{color:var(--t-muted); font-size:13.5px; margin-top:4px}
.mast .right{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
.crosslink{font-size:13px; white-space:nowrap; color:var(--t-muted); text-decoration:none; padding-bottom:8px}
.crosslink:hover{color:var(--t-fg)}

/* Segmented controls: a recessed track holding a raised pill */
.tabs, .seg{display:inline-flex; gap:2px; padding:3px; background:var(--t-card); border-radius:var(--t-radius);
  box-shadow:var(--t-inset-deep); flex-wrap:wrap}
.tabs{margin-bottom:20px}
.tab, .seg button{font-family:var(--t-font-body); font-size:13px; font-weight:500; letter-spacing:-0.01em; text-decoration:none;
  padding:6px 14px; min-height:32px; display:inline-flex; align-items:center; border:0; border-radius:calc(var(--t-radius) - 3px);
  background:transparent; color:var(--t-muted); cursor:pointer;
  transition:color 150ms var(--t-ease), background 150ms var(--t-ease), box-shadow 150ms var(--t-ease)}
.tab:hover, .seg button:hover{color:var(--t-fg)}
.tab[aria-current="page"], .seg button[aria-pressed="true"]{color:var(--t-fg); background:var(--t-pill);
  box-shadow:var(--t-shadow-pill); text-shadow:var(--t-pressed)}

/* Fields: recessed wells */
select, input{font-family:var(--t-font-body); font-size:13px; color:var(--t-fg); background:var(--t-card);
  border:0; padding:6px 10px; min-height:34px; border-radius:var(--t-radius-sm); box-shadow:var(--t-inset)}
select:focus, input:focus{outline:none; box-shadow:var(--t-inset), 0 0 0 2px var(--t-focus)}
select option{background:var(--t-pop)}
label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--t-muted)}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px}

/* Cards: raised tiles */
.card{background:var(--t-card); border-radius:var(--t-radius); box-shadow:var(--t-shadow); padding:20px; margin-bottom:16px}
.eyebrow{display:block; font-size:15px; font-weight:600; letter-spacing:-0.015em; color:var(--t-fg); margin-bottom:4px}
.note{color:var(--t-muted); font-size:13px; line-height:1.55}
.note b{color:var(--t-fg); font-weight:600}
.badge{display:inline-block; font-size:11px; font-weight:500; padding:1px 8px; border-radius:999px;
  background:color-mix(in oklch, var(--t-away) 16%, transparent); color:var(--t-away); line-height:1.6}
.btn{font-family:var(--t-font-body); font-size:13px; font-weight:500; cursor:pointer; padding:7px 16px; min-height:34px;
  border:0; border-radius:var(--t-radius-sm); color:var(--t-fg); background:var(--t-pill); box-shadow:var(--t-shadow-pill);
  transition:box-shadow 150ms var(--t-ease), background 150ms var(--t-ease)}
.btn:hover{background:var(--t-pill-hover); box-shadow:var(--t-shadow-pill-hover)}
.btn:active{box-shadow:var(--t-inset); background:var(--t-card)}

/* Tables */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums lining-nums; font-size:13px}
th, td{padding:8px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--t-line)}
th{font-weight:500; font-size:12px; color:var(--t-muted); position:sticky; top:0; background:var(--t-card);
  cursor:pointer; user-select:none}
th:hover{color:var(--t-fg)}
th.sorted{color:var(--t-fg)}
th.sorted::after{content:" \25BE"} th.sorted.asc::after{content:" \25B4"}
th.l, td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--t-hover)}
tr.click{cursor:pointer}
td.rank{color:var(--t-dim); width:1%}
.pos{color:var(--t-good)} .neg{color:var(--t-bad)}
.team-chip{display:inline-block; min-width:38px; font-weight:600}
.muted{color:var(--t-muted)}
.win{font-weight:650}
.bar{display:inline-block; height:6px; vertical-align:middle; margin-left:6px; border-radius:3px}
.more{margin-top:14px}

/* Game sheet */
.score{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin-bottom:16px}
.score .side{display:flex; flex-direction:column; gap:2px}
.score .side.home{align-items:flex-end; text-align:right}
.score .abbr{font-family:var(--t-font-head); font-size:30px; font-weight:700; letter-spacing:-0.02em}
.score .nm{color:var(--t-muted); font-size:12.5px}
.score .mid{text-align:center}
.score .big{font-family:var(--t-font-num); font-size:44px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums}
.away-c{color:var(--t-away)} .home-c{color:var(--t-home)}
.tiles{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.tile{background:var(--t-card-2); border-radius:calc(var(--t-radius) - 4px); box-shadow:var(--t-inset); padding:10px 12px}
.tile .k{font-size:12px; color:var(--t-muted)}
.tile .v{font-family:var(--t-font-num); font-size:20px; font-weight:600; margin-top:2px; display:flex; justify-content:space-between; gap:6px;
  font-variant-numeric:tabular-nums}
.grid2{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px}
svg.rink{display:block; width:100%; height:auto}
.board{fill:var(--t-ice); stroke:var(--t-board); stroke-width:.7}
.mark{fill:none; stroke:var(--t-paint); stroke-width:.35}
.mark.blue{stroke:var(--t-blue); stroke-width:1.1}
.mark.red{stroke:var(--t-red); stroke-width:.6}
.dot{stroke-width:.5; cursor:pointer}
.blk{stroke-width:.6; opacity:.55}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--t-muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px}
svg.flow{display:block; width:100%; height:auto}
.axis{stroke:var(--t-line-2)} .gridl{stroke:var(--t-line); stroke-dasharray:3 3}
svg text{font-family:var(--t-font-body); fill:var(--t-muted)}
.flow text{font-size:11px}
.tip{position:fixed; pointer-events:none; z-index:50; background:var(--t-pop); color:var(--t-fg);
  padding:8px 10px; font-size:12px; line-height:1.5; display:none; max-width:250px;
  box-shadow:var(--t-shadow-lg); border-radius:var(--t-radius-sm)}
.tip b{font-weight:600; color:var(--t-fg)}
.back{margin-bottom:12px; display:inline-block; font-size:13px; color:var(--t-muted); text-decoration:none}
.back:hover{color:var(--t-fg)}

/* Team lenses */
.lenses{margin:10px 0 8px}
.lens-desc{font-size:13px; color:var(--t-muted); min-height:2.6em}
svg.quad{display:block; width:100%; height:auto; margin-top:4px}
svg.quad .qlabel{font-size:11.5px; font-weight:600}
svg.quad .tm{font-size:10px; fill:var(--t-fg-2)}
svg.quad .ax{font-size:11px}
.callouts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:12px}
.callout{padding:10px 12px; background:var(--t-card-2); border-radius:calc(var(--t-radius) - 4px); box-shadow:var(--t-inset); font-size:12.5px}
.callout .h{font-size:12.5px; font-weight:600; color:var(--t-fg); margin-bottom:2px}
.callout .h::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--q); margin-right:7px; vertical-align:1px}

.kv{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:12px 0}
.prose p{margin:0 0 10px; color:var(--t-muted); max-width:72ch}
.prose p b{color:var(--t-fg); font-weight:600}
.prose h3{font-family:var(--t-font-head); font-size:15px; font-weight:600; letter-spacing:-0.015em; margin:18px 0 8px}
.loading{padding:48px 0; text-align:center; color:var(--t-muted); font-size:13px}

/* Layout pieces */
.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:10px}
.grid2even{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px}
.cols3{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr); gap:16px}
.cols3 > div{min-width:0}
.recap{margin:4px 0 20px}
.headline{font-family:var(--t-font-head); font-weight:700; font-size:26px; line-height:1.15; letter-spacing:-0.025em}
.recap.big .headline{font-size:clamp(28px, 4.4vw, 44px)}
.deck{font-size:15px; line-height:1.6; color:var(--t-fg-2); margin-top:10px; max-width:68ch}
.recap.big .deck{font-size:16.5px}
.broadsheet .recap{text-align:center}
.broadsheet .recap .deck{margin-left:auto; margin-right:auto}
.stars{margin:10px 0 4px; padding-left:22px; font-size:14px}
.stars li{margin-bottom:8px}
.stars li::marker{font-weight:700; color:var(--t-muted)}
.ptab td[rowspan]{vertical-align:middle; font-size:12px; color:var(--t-muted)}
.dateline{font-family:var(--t-font-head); font-weight:650; font-size:17px; letter-spacing:-0.015em; margin:24px 0 10px}
.dateline:first-child{margin-top:4px}
.minis{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px}
.mini{display:block; color:inherit; text-decoration:none; background:var(--t-card); border-radius:var(--t-radius);
  box-shadow:var(--t-shadow); padding:8px 10px 10px; transition:box-shadow 150ms var(--t-ease), background 150ms var(--t-ease)}
.mini:hover, .mini:focus-visible{background:var(--t-pop); box-shadow:var(--t-shadow-pill-hover); outline:none}
.mini table{font-size:13px}
.mini th{background:transparent; border-bottom:1px solid var(--t-line); padding:3px 4px; cursor:default}
.mini td{padding:4px 4px; border-bottom:0}
.mini tbody tr:hover{background:transparent}
.mini tr.win td{font-weight:650}
.mini-foot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px; min-height:16px}
.xgbar{display:flex; width:80px; height:6px; gap:2px; padding:0; border-radius:3px; overflow:hidden; box-shadow:var(--t-inset)}
.xgbar i{display:block}

@media (max-width: 900px){
  .cols3, .grid2even{grid-template-columns:1fr}
}
@media (max-width: 820px){
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2, minmax(0,1fr))}
  .kv, .callouts{grid-template-columns:1fr}
  .score .abbr{font-size:22px} .score .big{font-size:32px}
  .card{padding:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
/* ---- v2: links, selection, team page ---- */
.tlink{color:inherit; font-weight:600; text-decoration:underline; text-decoration-color:var(--t-line-2); text-underline-offset:3px}
.tlink:hover{text-decoration-color:var(--t-fg)}
.tname{font-size:12px}
.qteams{display:flex; flex-wrap:wrap; gap:4px 9px; margin-top:2px}
.tpt{cursor:pointer}
[data-tip]{cursor:help}
th[data-tip]{text-decoration:underline dotted var(--t-line-2); text-underline-offset:3px}
th[data-k]{cursor:pointer}
.tip{max-width:280px}
.dot.dim{opacity:.12}
.dot.hl{stroke:var(--t-fg) !important; stroke-width:1.4 !important}
.hlring{fill:none; stroke:var(--t-accent); stroke-width:.9; pointer-events:none; animation:ring 1.2s ease-out 2}
@keyframes ring{0%{stroke-width:2.4; opacity:.3}100%{stroke-width:.9; opacity:1}}
tr.on td{background:var(--t-hover)}
tr[data-shot]:focus-visible{outline:2px solid var(--t-focus); outline-offset:-2px}
.shotcap{position:relative; margin-top:10px; padding:10px 74px 10px 12px; min-width:0; overflow-wrap:anywhere;
  background:var(--t-card-2); border-radius:calc(var(--t-radius) - 4px); box-shadow:var(--t-inset); font-size:13px; line-height:1.5}
.shotcap .btn{position:absolute; top:7px; right:7px; padding:3px 10px; min-height:26px; font-size:12px}
.shotcap b{font-weight:600}
.mini th .status{font-weight:600; color:var(--t-fg)}
.grouphead{font-family:var(--t-font-head); font-weight:650; font-size:16px; letter-spacing:-0.015em; margin:0 0 8px}
tr.cutline td{border-bottom:1px solid var(--t-line-2)}
.tiles6{grid-template-columns:repeat(auto-fit, minmax(128px, 1fr))}
.seg button:disabled{opacity:.35; cursor:default}
.seg button:disabled:hover{color:var(--t-muted)}
svg.bars{display:block; width:100%; height:auto; margin-top:8px}
svg.bars text{font-size:20px}
.gbar{cursor:pointer} .gbar:hover rect{opacity:.6}
/* The broadsheet's three columns need room; below that they stack. */
@media (max-width: 1100px){ .cols3{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .hlring{animation:none} }
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Game Sheets</h1>
      <div class="sub" id="sub">Every NHL game, every shot, scored by expected goals</div>
    </div>
    <div class="right">
      <label class="f">Season <select id="season"></select></label>
      <a class="crosslink" href="./">Live tagger &rarr;</a>
      <a class="crosslink" href="./scatter.html">Shot chart &rarr;</a>
    </div>
  </header>

  <nav class="tabs" aria-label="Views">
    <a class="tab" href="#games" data-view="games">Games</a>
    <a class="tab" href="#teams" data-view="teams">Teams</a>
    <a class="tab" href="#players" data-view="players">Players</a>
    <a class="tab" href="#model" data-view="model">Model</a>
  </nav>

  <main id="view"><div class="loading">Loading&hellip;</div></main>
</div>

<script>
"use strict";
const BASE = "games/";
const S = { season: null, seasons: [], index: null, teams: null, players: null, games: {} };
const UI = {
  phase: "regular",
  games: { team: "", type: "all", sort: "date", shown: 100 },
  teams: { sort: "std", asc: true, lens: "drive", group: "league" },
  players: { kind: "skaters", team: "", pos: "", min: 100, mingp: 1, q: "", sort: "pts", asc: false, shown: 100 },
  team: { win: "season", mingp: 1, sk: { sort: "pts", asc: false }, gk: { sort: "gsax", asc: false }, log: { sort: "date", asc: false } },
  gsort: { home: { sort: "toi", asc: false }, away: { sort: "toi", asc: false } },
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
function f1(v){ return v == null ? "&ndash;" : (+v).toFixed(1); }
function f2(v){ return v == null ? "&ndash;" : (+v).toFixed(2); }
function pct(v, d=1){ return v == null ? "&ndash;" : (v*100).toFixed(d) + "%"; }
function sv(v){ return v == null ? "&ndash;" : v.toFixed(3).replace(/^0/, ""); }
function signed(v, d=1){ if (v == null) return "&ndash;"; const s=(+v).toFixed(d); return `<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${s}</span>`; }
function toi(sec){ if (!sec) return "&ndash;"; const m=Math.floor(sec/60), s=Math.round(sec%60); return `${m}:${String(s).padStart(2,"0")}`; }
function toiH(sec){ return sec ? (sec/60).toFixed(0) : "&ndash;"; }
function per60(x, sec){ return sec ? x*3600/sec : null; }
function share(f, a){ return f + a > 0 ? f / (f + a) : null; }
function fmtDate(d){ const [y,m,dd]=d.split("-"); return `${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]} ${+dd}`; }
function seasonLabel(s){ return `${s}-${String((s+1)%100).padStart(2,"0")}`; }
async function getJSON(path){ const r = await fetch(BASE + path, {cache:"no-store"}); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); }

/* The NHL feed codes wingers L and R; hockey says LW and RW. */
const POS = { L:"LW", R:"RW", C:"C", D:"D", G:"G" };
const posLabel = p => POS[p] || p;

/* Names and alignment (2024-25 onward: Utah in the Central). */
const TEAMS = {
  ANA:["Anaheim Ducks","West","Pacific"], BOS:["Boston Bruins","East","Atlantic"], BUF:["Buffalo Sabres","East","Atlantic"],

/* Header hovers: one floating card for every [data-tip] on the page. */
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) return;
  const tip = $("tip"), r = el.getBoundingClientRect();
  tip.innerHTML = `<b>${el.dataset.tipTitle || el.textContent.trim()}</b><br>${esc(el.dataset.tip)}`;
  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - 270)) + "px";
  tip.style.top = (r.bottom + 6) + "px";
});
document.addEventListener("mouseout", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el && !el.contains(e.relatedTarget)) $("tip").style.display = "none";
});

/* Sortable table. cols: [{k, label, get(row)->sortable, fmt(row)->html, l:left, asc:default-ascending, tip:key in TIPS}]
   Each table binds its own headers, so several can share a page. */
let TABLE_N = 0;
function table(rows, cols, st, onSort, rowAttr){
  const id = "tb" + (++TABLE_N);
  const th = cols.map(c => {
    const cls = [c.l ? "l" : "", st.sort === c.k ? "sorted" + (st.asc ? " asc" : "") : ""].join(" ");
    const tip = c.tip ? ` data-tip="${esc(TIPS[c.tip] || c.tip)}"` : "";
    return `<th class="${cls}" data-k="${c.k}"${tip}>${c.label}</th>`;
  }).join("");
  const body = rows.map((r, i) => `<tr ${rowAttr ? rowAttr(r) : ""}>` + cols.map(c =>
    `<td class="${c.l ? "l" : ""} ${c.cls||""}">${c.k === "#" ? i+1 : (c.fmt ? c.fmt(r, i) : esc(c.get(r)))}</td>`).join("") + "</tr>").join("");
  setTimeout(() => document.querySelectorAll(`#${id} th[data-k]`).forEach(h => h.onclick = () => {
    const k = h.dataset.k; const col = cols.find(c => c.k === k);
    if (k === "#" || !col.get) return;
    if (st.sort === k) st.asc = !st.asc; else { st.sort = k; st.asc = col.asc === true; }
    $("tip").style.display = "none";
    onSort();
  }));
  return `<div class="tw"><table id="${id}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function sortRows(rows, cols, st){
  const col = cols.find(c => c.k === st.sort && c.get) || cols.find(c => c.get);
  const g = col.get;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return st.asc ? c : -c;
  });
}

/* ---------- data ---------- */
async function loadSeason(season){
  S.season = season;
  $("view").innerHTML = `<div class="loading">Loading ${seasonLabel(season)}&hellip;</div>`;
  const [index, teams, players] = await Promise.all([
    getJSON(`${season}/index.json`), getJSON(`${season}/teams.json`), getJSON(`${season}/players.json`)]);
  Object.assign(S, { index, teams, players, games: {}, _std: null });
  const upd = new Date(index.updated);
  $("sub").textContent = `${seasonLabel(season)} · ${index.games.length} games · updated ${upd.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}`;
}
async function loadGame(id){
  if (!S.games[id]) S.games[id] = await getJSON(`${S.season}/games/${id}.json`);
  return S.games[id];
}
function teamList(){ return S.teams.regular.map(t => t.team).sort(); }

/* Regular season / playoffs switch, shown only once a season has playoff games. */
function phaseSeg(rerender){
  if (!S.teams.playoff.length) { UI.phase = "regular"; return ""; }
  setTimeout(() => document.querySelectorAll("[data-phase]").forEach(b =>
    b.onclick = () => { UI.phase = b.dataset.phase; rerender(); }));
  return `<div class="seg">${[["regular","Regular season"],["playoff","Playoffs"]].map(([k, l]) =>
    `<button data-phase="${k}" aria-pressed="${UI.phase===k}">${l}</button>`).join("")}</div>`;
}

/* ---------- router ---------- */
async function route(){
  const h = location.hash.replace(/^#/, "") || "games";
  const [view, arg] = h.split("/");
  const tabOf = { game:"games", team:"teams" };
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-current", t.dataset.view === (tabOf[view] || view) ? "page" : "false"));
  $("tip").style.display = "none";
  try {
    if (view === "game") return await renderGame(+arg);
    if (view === "team") return await renderTeam(arg);
    if (view === "teams") return renderTeams();
    if (view === "players") return renderPlayers();
    if (view === "model") return renderModel();
    return renderGames();
  } catch (e) {
    $("view").innerHTML = `<div class="card"><p class="note">Couldn't load this view: ${esc(e.message)}</p></div>`;
  }
}

/* ---------- games list ---------- */
function filteredGames(){
  const st = UI.games;
  let g = S.index.games.slice();
  if (st.team) g = g.filter(x => x.home === st.team || x.away === st.team);
  if (st.type !== "all") g = g.filter(x => x.type === (st.type === "playoff" ? 3 : 2));
  const winXg = x => (x.hs > x.as ? x.hxg - x.axg : x.axg - x.hxg);
  const sorts = {
    date: (a, b) => (b.date + b.id).localeCompare(a.date + a.id),
    lopsided: (a, b) => Math.abs(b.hxg - b.axg) - Math.abs(a.hxg - a.axg),
    total: (a, b) => (b.hxg + b.axg) - (a.hxg + a.axg),
    stole: (a, b) => winXg(a) - winXg(b),
  };
  return g.sort(sorts[st.sort]);
}
const isUpset = x => x.hs !== x.as && (x.hxg >= x.axg) !== (x.hs > x.as);
const longDate = d => new Date(d + "T12:00:00").toLocaleDateString([], { weekday:"long", month:"long", day:"numeric" });

function gameFilters(count, rerender){
  const st = UI.games;
  const opts = ['<option value="">All teams</option>'].concat(teamList().map(t => `<option ${t===st.team?"selected":""}>${t}</option>`)).join("");
  setTimeout(() => {
    $("gTeam").onchange = e => { st.team = e.target.value; st.shown = 100; rerender(); };
    $("gType").onchange = e => { st.type = e.target.value; st.shown = 100; rerender(); };
    $("gSort").onchange = e => { st.sort = e.target.value; st.shown = 100; rerender(); };
    if ($("gMore")) $("gMore").onclick = () => { st.shown += 200; rerender(); };
  });
  return `<div class="filters">
      <label class="f">Team <select id="gTeam">${opts}</select></label>
      <label class="f">Games <select id="gType">
        <option value="all">All</option><option value="regular" ${st.type==="regular"?"selected":""}>Regular season</option>
        <option value="playoff" ${st.type==="playoff"?"selected":""}>Playoffs</option></select></label>
      <label class="f">Sort <select id="gSort">
        <option value="date">Newest</option>
        <option value="lopsided" ${st.sort==="lopsided"?"selected":""}>Most lopsided xG</option>
        <option value="total" ${st.sort==="total"?"selected":""}>Most total xG</option>
        <option value="stole" ${st.sort==="stole"?"selected":""}>Won despite xG</option></select></label>
      <span class="note">${count} games</span>
    </div>`;
}
const moreBtn = (n) => n > UI.games.shown ? `<button class="btn more" id="gMore">Show more</button>` : "";
function bindGameLinks(){
  document.querySelectorAll("[data-id]").forEach(r => r.onclick = () => location.hash = "game/" + r.dataset.id);
}
function byDate(games){
  const out = [];
  games.forEach(x => { const last = out[out.length - 1]; if (last && last.date === x.date) last.games.push(x); else out.push({ date:x.date, games:[x] }); });
  return out;
}

/* A mini box score: the line score a paper prints for every game. */
function miniBox(x){
  const line = (ab, s, xg, sog, won) => `<tr class="${won ? "win" : ""}"><td class="l">${ab}</td><td>${s}</td><td class="muted">${f2(xg)}</td><td class="muted">${sog}</td></tr>`;
  const status = x.end === "REG" ? "Final" : "F/" + x.end;
  const flag = [x.type === 3 ? "Playoffs" : "", isUpset(x) ? "Upset" : ""].filter(Boolean).join(" · ");
  return `<a class="mini" href="#game/${x.id}" aria-label="${x.away} ${x.as}, ${x.home} ${x.hs}, ${fmtDate(x.date)}">
    <table><thead><tr><th class="l">${fmtDate(x.date)} &middot; <b class="status">${status}</b></th><th>G</th><th>xG</th><th>SOG</th></tr></thead><tbody>
      ${line(x.away, x.as, x.axg, x.asog, x.as > x.hs)}${line(x.home, x.hs, x.hxg, x.hsog, x.hs > x.as)}</tbody></table>
    <div class="mini-foot">${flag ? `<span class="badge">${flag}</span>` : "&nbsp;"}<span class="xgbar"><i style="flex:${x.axg};background:var(--t-away)"></i><i style="flex:${x.hxg};background:var(--t-home)"></i></span></div>
  </a>`;
}

function renderGames(){
  const g = filteredGames();
  const shown = g.slice(0, UI.games.shown);
  const groups = UI.games.sort === "date" ? byDate(shown) : [{ date:null, games:shown }];
  $("view").innerHTML = gameFilters(g.length, renderGames) +
    groups.map(d => `${d.date ? `<h2 class="dateline">${longDate(d.date)}</h2>` : ""}
      <div class="minis">${d.games.map(miniBox).join("")}</div>`).join("") + moreBtn(g.length) +
    `<p class="note" style="margin-top:12px">Each box: goals, expected goals and shots on goal; the bar splits the xG. <b>Upset</b>: won while losing the xG battle.</p>`;
  bindGameLinks();
}

/* ---------- rink ---------- */
const GOAL_X = 89, R_CREASE = 6;
function fullRinkPath(){
  return "M -72 -42.5 H 72 A 28 28 0 0 1 100 -14.5 V 14.5 A 28 28 0 0 1 72 42.5 H -72 A 28 28 0 0 1 -100 14.5 V -14.5 A 28 28 0 0 1 -72 -42.5 Z";
}
function rinkMarkup(){
  const p = [`<clipPath id="ice"><path d="${fullRinkPath()}"/></clipPath>`, `<path class="board" d="${fullRinkPath()}"/>`, `<g clip-path="url(#ice)">`];
  p.push(`<line class="mark red" x1="0" y1="-42.5" x2="0" y2="42.5" style="stroke-width:1.1"/>`);
  [-25, 25].forEach(x => p.push(`<line class="mark blue" x1="${x}" y1="-42.5" x2="${x}" y2="42.5"/>`));
  [-1, 1].forEach(s => {
    const gx = s*GOAL_X, cx = s*(GOAL_X - Math.sqrt(R_CREASE*R_CREASE - 16));
    p.push(`<line class="mark red" x1="${gx}" y1="-36.75" x2="${gx}" y2="36.75"/>`);
    p.push(`<path class="mark red" d="M ${gx} -4 H ${cx.toFixed(2)} A ${R_CREASE} ${R_CREASE} 0 0 ${s>0?0:1} ${cx.toFixed(2)} 4 H ${gx}"/>`);
    p.push(`<rect class="mark red" x="${s>0?gx:gx-4}" y="-3" width="4" height="6"/>`);
    [[69,-22],[69,22]].forEach(c => {
      p.push(`<circle class="mark" cx="${s*c[0]}" cy="${c[1]}" r="15"/>`);
      p.push(`<circle cx="${s*c[0]}" cy="${c[1]}" r="1" fill="var(--t-red)"/>`);
    });
    [[20,-22],[20,22]].forEach(c => p.push(`<circle cx="${s*c[0]}" cy="${c[1]}" r="1" fill="var(--t-red)"/>`));
  });
  p.push(`<circle class="mark blue" cx="0" cy="0" r="15" style="stroke-width:.5"/>`);
  p.push(`</g>`);
  return p.join("");
}
function radius(xg){ return 1.1 + Math.sqrt(Math.max(xg, 0)) * 5.5; }

const SIT = { EV_5v5:"5v5", PP_5v4:"PP 5v4", SH_4v5:"SH 4v5", EV_4v4:"4v4", EV_3v3:"3v3 OT", PP_5v3:"PP 5v3",
  PP_4v3:"PP 4v3", SH_3v5:"SH 3v5", EN_AGAINST:"Empty net", EN_6v5_PULLED:"6v5 goalie pulled", EN_6v5_DELAYED_PEN:"6v5 delayed penalty" };
const EVN = { GOAL:"Goal", SHOT:"Saved", MISS:"Missed", BLOCK:"Blocked" };
const TYPE = { WRIST:"Wrist", SNAP:"Snap", SLAP:"Slap", BACK:"Backhand", TIP:"Tip-in", DEFL:"Deflection", WRAP:"Wrap-around", UNKNOWN:"Unknown" };
const ORD = p => p <= 3 ? ["1st","2nd","3rd"][p - 1] : (p === 4 ? "OT" : `${p - 3}OT`);
const TWO_WORD = ["Golden Knights", "Maple Leafs", "Blue Jackets", "Red Wings"];
function nickname(full){ const t = TWO_WORD.find(n => full.endsWith(n)); return t || full.split(" ").slice(-1)[0]; }

/* ---------- game sheet: data ---------- */
async function getSheet(id){
  const G = await loadGame(id);
  if (!G._shots) {
    G._shots = G.shots.map((r, i) => { const o = Object.fromEntries(G.shot_keys.map((k, j) => [k, r[j]])); o.i = i; return o; });
    G._names = Object.fromEntries(G.players.map(p => [p.id, p]));
  }
  return G;
}
const pname = (G, id) => (G._names[id] || {}).name || "Unknown";
const lastName = (G, id) => pname(G, id).split(" ").slice(1).join(" ") || pname(G, id);

/* Saves and shots on goal against one goalie (misses aren't saves). */
function saves(G, id){
  const on = G._shots.filter(s => s.goalie === id && (s.ev === "SHOT" || s.ev === "GOAL"));
  return { shots:on.length, saves:on.filter(s => s.ev === "SHOT").length };
}
function stars(G){
  const sk = G.players.filter(p => p.pos !== "G" && (p.toi_all || p.att)).map(p =>
    ({ p, v:(p.g||0) * .5 + (p.ixg||0) + .4 * ((p.xgf||0) - (p.xga||0)),
       why:`${p.g ? p.g + "G, " : ""}${f2(p.ixg||0)} ixG, on-ice xG ${f2(p.xgf||0)}&ndash;${f2(p.xga||0)}` }));
  const gk = G.players.filter(p => p.pos === "G" && p.sa).map(p => { const sv = saves(G, p.id);
    return { p, v:(p.xga_||0) - (p.ga_||0), why:`${sv.saves} saves on ${sv.shots} shots, ${signed((p.xga_||0)-(p.ga_||0), 2)} GSAx` }; });
  return sk.concat(gk).sort((a, b) => b.v - a.v).slice(0, 3);
}

/* The 5-on-5 clause has to agree with the direction of the overall one. */
function fiveOnFive(w, l){
  if (Math.abs(w.xg5 - l.xg5) <= .5) return "";
  return w.xg5 > l.xg5 ? ` and ${f2(w.xg5)} to ${f2(l.xg5)} at five-on-five`
    : `, though the ${nickname(l.name)} had the better of five-on-five, ${f2(l.xg5)} to ${f2(w.xg5)}`;
}
function recap(G){
  const H = G.home, A = G.away, w = H.score > A.score ? H : A, l = w === H ? A : H;
  const margin = w.score - l.score;
  const verb = G.end === "SO" ? "win a shootout over" : G.end === "OT" ? "beat" : l.score === 0 ? "blank" : margin >= 3 ? "roll past" : margin === 1 ? "edge" : "beat";
  const headline = `${nickname(w.name)} ${verb} ${nickname(l.name)} ${w.score}&ndash;${l.score}${G.end === "OT" ? " in overtime" : ""}`;
  const s = [];
  const xgW = w.xg, xgL = l.xg;
  if (Math.abs(xgW - xgL) < .35) s.push(`On chances it was close to even: ${f2(xgW)} to ${f2(xgL)} in expected goals${Math.abs(w.xg5 - l.xg5) > .5 ? `, ${f2(w.xg5)} to ${f2(l.xg5)} at five-on-five` : ""}.`);
  else if (xgW >= xgL) s.push(`The ${nickname(w.name)} earned it, out-chancing the ${nickname(l.name)} ${f2(xgW)} to ${f2(xgL)} in expected goals${fiveOnFive(w, l)}.`);
  else s.push(`The ${nickname(w.name)} won despite being out-chanced ${f2(xgL)} to ${f2(xgW)} in expected goals${l.att > w.att ? `, and out-attempted ${l.att} to ${w.att}` : ""}.`);
  const best = G._shots.filter(x => x.ev !== "BLOCK" && x.sit !== "EN_AGAINST").sort((a, b) => b.xg - a.xg)[0];
  if (best) s.push(`The best chance was ${pname(G, best.shooter)}'s ${(TYPE[best.type]||"").toLowerCase()} (${best.xg.toFixed(2)} xG) at ${toi(best.t)} of the ${ORD(best.p)}${best.ev === "GOAL" ? ", and it went in" : best.ev === "SHOT" ? `, stopped by ${pname(G, best.goalie)}` : ", and it missed"}.`);
  const gks = G.players.filter(p => p.pos === "G" && p.sa).map(p => ({ p, gsax:(p.xga_||0) - (p.ga_||0) })).sort((a, b) => b.gsax - a.gsax);
  if (gks[0] && gks[0].gsax > .75) { const sv = saves(G, gks[0].p.id);
    s.push(`${gks[0].p.name} made ${sv.saves} saves on ${sv.shots} shots, ${gks[0].gsax.toFixed(1)} goals better than an average goalie would have done on the same chances.`); }
  return { headline, text:s.join(" ") };
}

/* ---------- game sheet: sections ---------- */
function secScore(G){
  const H = G.home, A = G.away;
  const tiles = [["Expected goals", A.xg, H.xg, f2], ["5v5 xG", A.xg5, H.xg5, f2], ["Shot attempts", A.att, H.att, v => v], ["Shots on goal", A.sog, H.sog, v => v]]
    .map(([k, a, h, f]) => `<div class="tile"><div class="k">${k}</div><div class="v"><span class="away-c">${f(a)}</span><span class="home-c">${f(h)}</span></div></div>`).join("");
  return `<div class="card">
      <div class="score">
        <div class="side away"><span class="abbr away-c">${A.abbrev}</span><span class="nm">${esc(A.name)} &middot; away</span></div>
        <div class="mid"><div class="big"><span class="away-c">${A.score}</span> &ndash; <span class="home-c">${H.score}</span></div>
          <div class="note">${G.end !== "REG" ? G.end + " &middot; " : "Final &middot; "}${fmtDate(G.date)} &middot; ${esc(G.venue||"")}</div></div>
        <div class="side home"><span class="abbr home-c">${H.abbrev}</span><span class="nm">home &middot; ${esc(H.name)}</span></div>
      </div>
      <div class="tiles">${tiles}</div></div>`;
}
function secMap(G, opts = {}){
  const H = G.home, A = G.away;
  const dots = G._shots.filter(s => GAME_BLOCKS || s.ev !== "BLOCK").map(s => {
    const home = s.team === H.abbrev, x = home ? s.x : -s.x, y = home ? -s.y : s.y, col = home ? "var(--t-home)" : "var(--t-away)";
    if (s.ev === "BLOCK")
      return `<g class="blk" stroke="${col}"><line x1="${x-1.2}" y1="${y-1.2}" x2="${x+1.2}" y2="${y+1.2}"/><line x1="${x-1.2}" y1="${y+1.2}" x2="${x+1.2}" y2="${y-1.2}"/></g>`;
    const goal = s.ev === "GOAL";
    return `<circle class="dot" data-i="${s.i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius(s.xg).toFixed(2)}"
      fill="${col}" fill-opacity="${goal ? .95 : .4}" stroke="${goal ? "var(--t-ring)" : col}" stroke-width="${goal ? 1.2 : .5}"/>`;
  }).join("");
  return `<div class="card">
    <div class="sec-head"><span class="eyebrow">Shot map</span><div class="seg"><button class="blkBtn" aria-pressed="${GAME_BLOCKS}">Blocks</button></div></div>
    <svg class="rink" viewBox="-102 -45 204 90" role="img" aria-label="Shot map">${rinkMarkup()}${dots}</svg>
    <div class="legend"><span><i style="background:var(--t-away)"></i>${A.abbrev} shoots &larr;</span>
      <span><i style="background:var(--t-home)"></i>${H.abbrev} shoots &rarr;</span>
      <span><i style="background:transparent;border:1.5px solid var(--t-ring)"></i>goal</span><span>size = xG</span></div>
    <div id="shotCap" aria-live="polite"></div></div>`;
}
function secFlow(G, wide){
  return `<div class="card"><span class="eyebrow">xG over the game</span>
    <div style="margin-top:8px">${flowChart(G._shots, G.home.abbrev, G.away.abbrev, wide)}</div>
    <p class="note" style="margin-top:6px">Cumulative expected goals; dots are goals. Steep stretches are where a team was generating chances.</p></div>`;
}
function secPeriods(G){
  const H = G.home.abbrev, A = G.away.abbrev;
  const maxP = Math.max(3, ...G._shots.map(s => s.p));
  const ps = Array.from({ length:maxP }, (_, i) => i + 1);
  const agg = (team, p, f) => G._shots.filter(s => s.team === team && s.p === p).reduce((a, s) => a + f(s), 0);
  const block = (label, f, fmt) => [A, H].map((t, i) => `<tr>${i === 0 ? `<td class="l" rowspan="2"><b>${label}</b></td>` : ""}
      <td class="l ${t === H ? "home-c" : "away-c"}">${t}</td>${ps.map(p => `<td>${fmt(agg(t, p, f))}</td>`).join("")}
      <td><b>${fmt(ps.reduce((a, p) => a + agg(t, p, f), 0))}</b></td></tr>`).join("");
  return `<div class="card"><span class="eyebrow">By period</span><div class="tw" style="margin-top:6px"><table class="ptab">
    <thead><tr><th class="l"></th><th class="l"></th>${ps.map(p => `<th>${ORD(p)}</th>`).join("")}<th>T</th></tr></thead><tbody>
    ${block("Goals", s => s.ev === "GOAL" ? 1 : 0, v => v)}
    ${block("Shots", s => s.ev === "GOAL" || s.ev === "SHOT" ? 1 : 0, v => v)}
    ${block("xG", s => s.xg, v => v.toFixed(2))}
    </tbody></table></div>${G.end === "SO" ? `<p class="note">Decided in a shootout, which isn't in these totals.</p>` : ""}</div>`;
}
function secScoring(G){
  let a = 0, h = 0;
  const rows = G._shots.filter(s => s.ev === "GOAL").map(s => {
    if (s.team === G.home.abbrev) h++; else a++;
    const ast = (s.ast || []).map(id => lastName(G, id)).join(", ");
    return `<tr class="click" data-shot="${s.i}" tabindex="0" title="Show on the rink"><td class="l">${ORD(s.p)}</td><td class="l">${toi(s.t)}</td>
      <td class="l ${s.team === G.home.abbrev ? "home-c" : "away-c"}">${s.team}</td>
      <td class="l"><b>${esc(pname(G, s.shooter))}</b>${ast ? ` <span class="muted">(${esc(ast)})</span>` : ` <span class="muted">(unassisted)</span>`}</td>
      <td class="l muted">${SIT[s.sit] || s.sit}${s.reb !== "NONE" ? ", rebound" : ""}</td>
      <td class="l muted">${TYPE[s.type] || ""}</td><td>${s.xg.toFixed(2)}</td><td>${a}&ndash;${h}</td></tr>`;
  }).join("");
  return `<div class="card"><span class="eyebrow">Scoring</span><div class="tw" style="margin-top:6px"><table>
    <thead><tr><th class="l">Per</th><th class="l">Time</th><th class="l">Team</th><th class="l">Goal (assists)</th><th class="l">Strength</th><th class="l">Shot</th><th>xG</th><th>Score</th></tr></thead>
    <tbody>${rows || `<tr><td class="l muted" colspan="8">No goals.</td></tr>`}</tbody></table></div></div>`;
}
function secStars(G){
  return `<div class="card"><span class="eyebrow">Stars, by the numbers</span><ol class="stars">
    ${stars(G).map(({ p, why }) => `<li><b>${esc(p.name)}</b> <span class="${p.team === G.home.abbrev ? "home-c" : "away-c"}">${p.team}</span><br><span class="muted">${why}</span></li>`).join("")}
    </ol><p class="note">Goals, the xG of a player's own shots and the xG balance while he was on the ice; goalies by goals saved above expected.</p></div>`;
}
function secChances(G, n = 6){
  const top = G._shots.filter(s => s.ev !== "BLOCK" && s.sit !== "EN_AGAINST").sort((a, b) => b.xg - a.xg).slice(0, n);
  return `<div class="card"><span class="eyebrow">Best chances</span><div class="tw" style="margin-top:6px"><table>
    <thead><tr><th class="l">Shooter</th><th class="l">When</th><th class="l">Shot</th><th>xG</th><th class="l">Result</th></tr></thead><tbody>
    ${top.map(s => `<tr class="click shot-row" data-shot="${s.i}" tabindex="0" title="Show on the rink"><td class="l"><span class="${s.team === G.home.abbrev ? "home-c" : "away-c"}">${s.team}</span> ${esc(pname(G, s.shooter))}</td>
      <td class="l muted">${ORD(s.p)} ${toi(s.t)}</td><td class="l muted">${TYPE[s.type] || ""}${s.reb !== "NONE" ? ", rebound" : ""}${s.rush ? ", rush" : ""}</td>
      <td><b>${s.xg.toFixed(2)}</b></td><td class="l">${s.ev === "GOAL" ? "<b>Goal</b>" : s.ev === "SHOT" ? `Saved by ${esc(lastName(G, s.goalie))}` : "Missed"}</td></tr>`).join("")}
    </tbody></table></div><p class="note" style="margin-top:6px">Click a chance to find it on the rink.</p></div>`;
}
function secRecap(G, big){
  const r = recap(G);
  return `<div class="recap ${big ? "big" : ""}"><h2 class="headline">${r.headline}</h2><p class="deck">${r.text}</p></div>`;
}

/* A roster, sortable by any column; re-renders only its own card. */
function secPlayers(G, side){
  const t = side === "home" ? G.home : G.away;
  const players = G.players.filter(p => p.team === t.abbrev);
  const sk = players.filter(p => p.pos !== "G" && (p.toi_all || p.att));
  const gk = players.filter(p => p.pos === "G" && (p.toi_all || p.sa));
  const n = v => v || 0;
  const cols = [
    { k:"name", label:"Skater", l:true, get:p => p.name, asc:true, fmt:p => `${esc(p.name)} <span class="muted">${posLabel(p.pos)}</span>` },
    { k:"toi", label:"TOI", get:p => n(p.toi_all), fmt:p => toi(p.toi_all), tip:"toitot" },
    { k:"toi5", label:"5v5", get:p => n(p.toi_5v5), fmt:p => toi(p.toi_5v5), tip:"toi5" },
    { k:"g", label:"G", get:p => n(p.g), tip:"g" },
    { k:"a", label:"A", get:p => n(p.a), tip:"a" },
    { k:"p", label:"P", get:p => n(p.g) + n(p.a), tip:"p" },
    { k:"ixg", label:"ixG", get:p => n(p.ixg), fmt:p => f2(n(p.ixg)), tip:"ixg" },
    { k:"att", label:"Att", get:p => n(p.att), tip:"att" },
    { k:"xgf", label:"xGF", get:p => n(p.xgf), fmt:p => f2(n(p.xgf)), tip:"xgf" },
    { k:"xga", label:"xGA", get:p => n(p.xga), fmt:p => f2(n(p.xga)), asc:true, tip:"xga" },
    { k:"xgs", label:"xG share", get:p => share(n(p.xgf), n(p.xga)), fmt:p => pct(share(n(p.xgf), n(p.xga)), 0), tip:"xgs" },
    { k:"xgs5", label:"5v5 xG share", get:p => share(n(p.xgf5), n(p.xga5)), fmt:p => pct(share(n(p.xgf5), n(p.xga5)), 0), tip:"xgs5" },
  ];
  const st = UI.gsort[side];
  const gRows = gk.map(p => `<tr><td class="l">${esc(p.name)} <span class="muted">G</span></td><td>${toi(p.toi_all)}</td>
    <td>${n(p.sa)}</td><td>${n(p.ga_)}</td><td>${f2(n(p.xga_))}</td><td>${signed(n(p.xga_) - n(p.ga_), 2)}</td></tr>`).join("");
  setTimeout(() => { const el = $("pt-" + side); if (el) el._rerender = () => { el.outerHTML = secPlayers(G, side); }; });
  return `<div class="card" id="pt-${side}"><span class="eyebrow ${side}-c">${esc(t.name)}</span>
    ${table(sortRows(sk, cols, st), cols, st, () => $("pt-" + side)._rerender())}
    <div class="tw" style="margin-top:10px"><table>
      <thead><tr><th class="l">Goalie</th><th data-tip="${esc(TIPS.toitot)}">TOI</th><th data-tip="${esc(TIPS.sa)}">Shots</th>
        <th data-tip="${esc(TIPS.gaG)}">GA</th><th data-tip="${esc(TIPS.xgaG)}">xGA</th><th data-tip="${esc(TIPS.gsax)}">GSAx</th></tr></thead>
      <tbody>${gRows}</tbody></table></div></div>`;
}
const PLAYER_NOTE = `<p class="note">Hover any column heading for what it means. TOI comes from the NHL shift chart.</p>`;

function shotDetail(G, s){
  return `<b>${esc(pname(G, s.shooter))}</b> <span class="muted">${s.team}</span><br>
    ${EVN[s.ev]} &middot; ${TYPE[s.type]||s.type}${s.ev === "SHOT" && s.goalie ? ` (${esc(lastName(G, s.goalie))})` : ""}<br>xG <b>${s.xg.toFixed(3)}</b> &middot; ${SIT[s.sit]||s.sit}<br>
    <span class="muted">${ORD(s.p)} ${toi(s.t)}${s.reb!=="NONE"?` &middot; rebound off a ${({SHOT:"save",MISS:"miss",BLOCK:"block"})[s.reb] || "shot"}`:""}${s.rush?" &middot; rush":""}</span>`;
}

/* Picking a shot (from Best chances, Scoring or the rink itself) rings it on
   the rink, fades the rest and writes it out under the map. */
let SEL_SHOT = null;
function selectShot(G, i, scroll){
  SEL_SHOT = SEL_SHOT === i ? null : i;
  const svg = document.querySelector("svg.rink");
  if (!svg) return;
  svg.querySelectorAll(".hlring").forEach(r => r.remove());
  svg.querySelectorAll(".dot").forEach(d => {
    const on = +d.dataset.i === SEL_SHOT;
    d.classList.toggle("dim", SEL_SHOT != null && !on);
    d.classList.toggle("hl", on);
  });
  document.querySelectorAll("[data-shot]").forEach(r => r.classList.toggle("on", +r.dataset.shot === SEL_SHOT));
  const cap = $("shotCap");
  if (SEL_SHOT == null) { cap.innerHTML = ""; return; }
  const dot = svg.querySelector(`.dot[data-i="${SEL_SHOT}"]`);
  if (dot) {
    svg.appendChild(dot);   // draw it above its neighbours
    const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    ring.setAttribute("class", "hlring");
    ring.setAttribute("cx", dot.getAttribute("cx")); ring.setAttribute("cy", dot.getAttribute("cy"));
    ring.setAttribute("r", (+dot.getAttribute("r") + 2.6).toFixed(2));
    svg.appendChild(ring);
  }
  cap.innerHTML = `<div class="shotcap">${shotDetail(G, G._shots[SEL_SHOT])}<button class="btn" id="shotClear">Clear</button></div>`;
  $("shotClear").onclick = () => selectShot(G, SEL_SHOT);
  if (scroll) {
    const r = svg.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) svg.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

function bindGame(G, rerender){
  document.querySelectorAll(".blkBtn").forEach(b => b.onclick = () => { GAME_BLOCKS = !GAME_BLOCKS; rerender(); });
  const tip = $("tip");
  document.querySelectorAll(".dot").forEach(el => {
    el.onmousemove = e => {
      tip.innerHTML = shotDetail(G, G._shots[+el.dataset.i]);
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 260) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    };
    el.onmouseleave = () => tip.style.display = "none";
    el.onclick = () => selectShot(G, +el.dataset.i, false);
  });
  document.querySelectorAll("[data-shot]").forEach(r => {
    r.onclick = () => selectShot(G, +r.dataset.shot, true);
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); r.onclick(); } };
  });
  if (SEL_SHOT != null) { const keep = SEL_SHOT; SEL_SHOT = null; selectShot(G, keep, false); }
}

/* ---------- game sheet: the front page ---------- */
/* A broadsheet page: headline and recap across the top, the line score,
   then three columns (stars and chances · map and the xG race · periods
   and scoring) above both rosters. */
function gameBody(G){
  return `
    <div class="broadsheet">
      ${secRecap(G, true)}
      ${secScore(G)}
      <div class="cols3">
        <div>${secStars(G)}${secChances(G, 5)}</div>
        <div>${secMap(G)}${secFlow(G)}</div>
        <div>${secPeriods(G)}${secScoring(G)}</div>
      </div>
      <div class="grid2even">${secPlayers(G, "away")}${secPlayers(G, "home")}</div>${PLAYER_NOTE}
    </div>`;
}

let GAME_BLOCKS = false;
async function renderGame(id){
  $("view").innerHTML = `<div class="loading">Loading game&hellip;</div>`;
  const G = await getSheet(id);
  if (renderGame.last !== id) SEL_SHOT = null;
  renderGame.last = id;
  $("view").innerHTML = `<a class="back" href="#games">&larr; All games</a>` + gameBody(G);
  bindGame(G, () => renderGame(id));
}

function flowChart(shots, home, away, wide){
  const W = wide ? 900 : 420, Hh = wide ? 260 : 250, L = 26, R = 8, T = 10, B = 24;
  const end = Math.max(3600, ...shots.map(s => (s.p - 1) * 1200 + s.t));
  const series = team => {
    let c = 0; const pts = [[0, 0]], goals = [];
    shots.filter(s => s.team === team && s.ev !== "BLOCK").forEach(s => {
      const g = (s.p - 1) * 1200 + s.t; pts.push([g, c]); c += s.xg; pts.push([g, c]);
      if (s.ev === "GOAL") goals.push([g, c]);
    });
    pts.push([end, c]); return { pts, goals, total: c };
  };
  const h = series(home), a = series(away);
  const ymax = Math.max(1, Math.ceil(Math.max(h.total, a.total) + .3));
  const X = t => L + t / end * (W - L - R), Y = v => T + (1 - v / ymax) * (Hh - T - B);
  const out = [`<svg class="flow" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Cumulative xG">`];
  for (let v = 0; v <= ymax; v += ymax > 6 ? 2 : 1)
    out.push(`<line class="gridl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`);
  for (let p = 1; p * 1200 < end + 1; p++) out.push(`<line class="axis" x1="${X(p*1200)}" x2="${X(p*1200)}" y1="${T}" y2="${Hh-B}"/>`);
  for (let p = 0; p * 1200 < end; p++)
    out.push(`<text x="${(X(p*1200)+X(Math.min(end,(p+1)*1200)))/2}" y="${Hh-8}" text-anchor="middle">${ORD(p + 1)}</text>`);
  // End labels: nudge apart when the two totals finish close together.
  let ya = Y(a.total) - 5, yh = Y(h.total) - 5;
  if (Math.abs(ya - yh) < 13) { if (a.total >= h.total) yh = ya + 13; else ya = yh + 13; }
  a.ly = ya; h.ly = yh;
  [[a, "var(--t-away)", away], [h, "var(--t-home)", home]].forEach(([s, col, ab]) => {
    out.push(`<polyline fill="none" stroke="${col}" stroke-width="2" points="${s.pts.map(p => X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`);
    s.goals.forEach(g => out.push(`<circle cx="${X(g[0])}" cy="${Y(g[1])}" r="4" fill="${col}" stroke="var(--t-ring)" stroke-width="1.2"/>`));
    out.push(`<text x="${W - R - 2}" y="${s.ly}" text-anchor="end" style="fill:${col};font-weight:600">${ab} ${s.total.toFixed(2)}</text>`);
  });
  out.push(`</svg>`);
  return out.join("");
}

/* ---------- standings ---------- */
/* Built from the games themselves so they always match the sheets: points,
   then the NHL's tiebreakers. Goals include the shootout winner's +1, as the
   league's standings do; gf_x / ga_x leave it out for comparisons with xG. */
function teamGames(ab, phase){
  const type = phase === "playoff" ? 3 : 2;
  return S.index.games.filter(x => x.type === type && (x.home === ab || x.away === ab))
    .slice().sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id))
    .map(x => {
      const home = x.home === ab, gf = home ? x.hs : x.as, ga = home ? x.as : x.hs, won = gf > ga;
      const so = x.end === "SO";
      return { x, id:x.id, date:x.date, home, opp:home ? x.away : x.home, gf, ga, won, end:x.end,
        res: won ? "W" : x.end === "REG" ? "L" : "OTL",
        gf_x: gf - (so && won ? 1 : 0), ga_x: ga - (so && !won ? 1 : 0),
        xgf: home ? x.hxg : x.axg, xga: home ? x.axg : x.hxg, xgf5: home ? x.hxg5 : x.axg5, xga5: home ? x.axg5 : x.hxg5,
        att: home ? x.hatt : x.aatt, atta: home ? x.aatt : x.hatt, sog: home ? x.hsog : x.asog, soga: home ? x.asog : x.hsog };
    });
}
function summarize(games){
  const t = { gp:games.length, w:0, l:0, otl:0, rw:0, row:0, gf:0, ga:0, gf_x:0, ga_x:0, xgf:0, xga:0, xgf5:0, xga5:0 };
  games.forEach(g => {
    t[g.res === "W" ? "w" : g.res === "L" ? "l" : "otl"]++;
    if (g.won && g.end === "REG") t.rw++;
    if (g.won && g.end !== "SO") t.row++;
    ["gf","ga","gf_x","ga_x","xgf","xga","xgf5","xga5"].forEach(k => t[k] += g[k]);
  });
  t.pts = 2 * t.w + t.otl; t.ppct = t.gp ? t.pts / (2 * t.gp) : null; t.diff = t.gf - t.ga;
  t.gax = t.gf_x - t.xgf; t.gsax = t.xga - t.ga_x;
  return t;
}
const stdCompare = (a, b) => b.pts - a.pts || (b.ppct ?? 0) - (a.ppct ?? 0) || b.rw - a.rw || b.row - a.row || b.w - a.w || b.diff - a.diff;
function standings(phase){
  return S.teams[phase].map(m => ({ ...m, ...summarize(teamGames(m.team, phase)), team:m.team }))
    .sort(stdCompare).map((t, i) => ({ ...t, lg:i + 1 }));
}

/* The groupings the NHL publishes: league, conference, division and the
   wild-card view (top three in each division, then two wild cards). */
function groupTeams(rows, group){
  const conf = t => (TEAMS[t.team] || [])[1] || "Other", div = t => (TEAMS[t.team] || [])[2] || "Other";
  if (group === "league") return [{ title:null, rows:rows.map((t, i) => ({ ...t, rk:String(i + 1) })) }];
  if (group === "conference") return ["East", "West"].map(c => ({ title:`${c}ern Conference`,
    rows:rows.filter(t => conf(t) === c).map((t, i) => ({ ...t, rk:String(i + 1) })) }));
  if (group === "division") return ["Atlantic", "Metropolitan", "Central", "Pacific"].map(d => ({ title:`${d} Division`,
    rows:rows.filter(t => div(t) === d).map((t, i) => ({ ...t, rk:String(i + 1) })) }));
  const out = [];
  [["East", ["Atlantic", "Metropolitan"]], ["West", ["Central", "Pacific"]]].forEach(([c, divs]) => {
    const leaders = [];
    divs.forEach(d => {
      const top = rows.filter(t => div(t) === d).slice(0, 3).map((t, i) => ({ ...t, rk:String(i + 1) }));
      leaders.push(...top);
      out.push({ title:`${d} Division`, rows:top });
    });
    const rest = rows.filter(t => conf(t) === c && !leaders.some(l => l.team === t.team))
      .map((t, i) => ({ ...t, rk:i < 2 ? `WC${i + 1}` : String(i + 1), cut:i === 1 }));
    out.push({ title:`${c}ern Conference wild card`, rows:rest });
  });
  return out;
}

/* ---------- teams ---------- */
function teamCols(st){
  return [
    { k:"std", label:"#", get:t => t.lg, asc:true, fmt:t => `<span class="muted">${t.rk ?? t.lg}</span>`, tip:"rank" },
    { k:"team", label:"Team", l:true, get:t => t.team, asc:true, fmt:t => `${teamLink(t.team)} <span class="muted tname">${esc(teamName(t.team).split(" ").slice(-1)[0])}</span>` },
    { k:"gp", label:"GP", get:t => t.gp, tip:"gp" },
    { k:"w", label:"W", get:t => t.w, tip:"w" },
    { k:"l", label:"L", get:t => t.l, asc:true, tip:"l" },
    { k:"otl", label:"OTL", get:t => t.otl, tip:"otl" },
    { k:"pts", label:"PTS", get:t => t.pts, fmt:t => `<b>${t.pts}</b>`, tip:"pts" },
    { k:"ppct", label:"P%", get:t => t.ppct, fmt:t => sv(t.ppct), tip:"ppct" },
    { k:"rw", label:"RW", get:t => t.rw, tip:"rw" },
    { k:"diff", label:"DIFF", get:t => t.diff, fmt:t => signed(t.diff, 0), tip:"diff" },

/* ---------- one team ---------- */
/* A team's page: where it stands, how it has played over a window (season,
   or its last 20, 10 or 5 games), its game log and its players. Player
   numbers are summed from the window's game sheets, so they count only
   games played for this team. */
const WINDOWS = [["season", "Season", Infinity], ["20", "Last 20", 20], ["10", "Last 10", 10], ["5", "Last 5", 5]];
async function renderTeam(ab){
  const st = UI.team;
  const all = teamGames(ab, UI.phase);
  if (!all.length) {
    $("view").innerHTML = `<a class="back" href="#teams">&larr; All teams</a><div class="card"><p class="note">${esc(teamName(ab))} has no ${UI.phase === "playoff" ? "playoff " : ""}games in ${seasonLabel(S.season)}.</p></div>`;
    return;
  }
  const n = WINDOWS.find(w => w[0] === st.win)[2];
  const games = all.slice(-Math.min(n, all.length));
  const t = summarize(games);
  const std = UI.phase === "regular" ? standings("regular") : null;
  const me = std && std.find(x => x.team === ab);
  const meta = TEAMS[ab] || [ab, "", ""];
  const rankIn = key => { const list = std.filter(x => (TEAMS[x.team] || [])[key] === meta[key]); return list.findIndex(x => x.team === ab) + 1; };
  const ord = k => k + (["th","st","nd","rd"][(k % 100 > 10 && k % 100 < 14) ? 0 : (k % 10 < 4 ? k % 10 : 0)]);
  const ranks = me ? `${ord(rankIn(2))} in the ${meta[2]} &middot; ${ord(rankIn(1))} in the ${meta[1]} &middot; ${ord(me.lg)} in the league` : "";

  const tile = (k, v, tip) => `<div class="tile"${tip ? ` data-tip="${esc(TIPS[tip])}" data-tip-title="${k}"` : ""}><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const winLabel = WINDOWS.find(w => w[0] === st.win)[1].toLowerCase();
  $("view").innerHTML = `
    <a class="back" href="#teams">&larr; All teams</a>
    <div class="recap"><h2 class="headline">${esc(teamName(ab))}</h2>
      <p class="deck">${me ? `${me.w}-${me.l}-${me.otl}, ${me.pts} points. ${ranks}.` : `${t.w}-${t.l}-${t.otl} in the playoffs.`}</p></div>
    <div class="filters">${phaseSeg(() => renderTeam(ab))}
      <div class="seg">${WINDOWS.map(([k, l, w]) => `<button data-win="${k}" aria-pressed="${st.win===k}" ${w !== Infinity && w > all.length ? "disabled" : ""}>${l}</button>`).join("")}</div>
      <span class="note">${games.length} game${games.length === 1 ? "" : "s"}${st.win !== "season" ? `, ${fmtDate(games[0].date)} to ${fmtDate(games[games.length - 1].date)}` : ""}</span></div>
    <div class="card"><span class="eyebrow">${st.win === "season" ? "Season" : winLabel}</span>
      <div class="tiles tiles6" style="margin-top:8px">

        ${tile("Goals", `${t.gf}&ndash;${t.ga}`, "diff")}
        ${tile("Expected goals", `${f1(t.xgf)}&ndash;${f1(t.xga)}`, "txgs")}
        ${tile("xG share", pct(share(t.xgf, t.xga)), "txgs")}
        ${tile("5v5 xG share", pct(share(t.xgf5, t.xga5)), "txgs5")}
        ${tile("GAx", signed(t.gax), "tgax")}
        ${tile("GSAx", signed(t.gsax), "tgsax")}
      </div></div>
    <div class="card"><span class="eyebrow">Game by game</span>${gameBars(games)}
      <p class="note">Bars: expected goals for (up) and against (down) in each game. Filled squares are wins. The line is the rolling five-game xG share.</p></div>
    <div class="card"><span class="eyebrow">Game log</span>${gameLog(ab, games)}</div>
    <div class="card" id="teamPlayers"><div class="loading">Loading players&hellip;</div></div>`;
  document.querySelectorAll("[data-win]").forEach(b => b.onclick = () => { st.win = b.dataset.win; renderTeam(ab); });
  document.querySelectorAll("[data-gid]").forEach(r => r.onclick = () => location.hash = "game/" + r.dataset.gid);

  const sheets = await Promise.all(games.map(g => loadGame(g.id)));
  if (!location.hash.startsWith("#team/" + ab)) return;   // the user moved on

  bindTeamPlayers(ab, sheets, games.length);
}

function gameBars(games){
  const W = 900, H = 200, L = 30, R = 10, mid = H / 2, bw = Math.max(3, Math.min(18, (W - L - R) / games.length - 2));
  const max = Math.max(3, ...games.map(g => Math.max(g.xgf, g.xga)));
  const X = i => L + (i + .5) * (W - L - R) / games.length, Y = v => v / max * (mid - 14);
  const o = [`<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Expected goals by game">`,
    `<line class="axis" x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}"/>`,
    `<text x="${L - 6}" y="${mid - Y(max) + 4}" text-anchor="end">${max.toFixed(0)}</text><text x="${L - 6}" y="${mid + Y(max) + 4}" text-anchor="end">${max.toFixed(0)}</text>`];
  games.forEach((g, i) => {
    const x = X(i);
    o.push(`<g class="gbar" data-gid="${g.id}"><title>${fmtDate(g.date)} ${g.home ? "vs" : "@"} ${g.opp}: ${g.res} ${g.gf}-${g.ga}, xG ${g.xgf.toFixed(2)}-${g.xga.toFixed(2)}</title>
      <rect x="${x - bw / 2}" y="${mid - Y(g.xgf)}" width="${bw}" height="${Y(g.xgf)}" fill="var(--t-home)"/>
      <rect x="${x - bw / 2}" y="${mid}" width="${bw}" height="${Y(g.xga)}" fill="var(--t-away)" opacity=".75"/>
      <rect x="${x - 3}" y="${H - 9}" width="6" height="6" fill="${g.won ? "var(--t-fg)" : "none"}" stroke="var(--t-fg)"/></g>`);
  });
  const roll = games.map((g, i) => { const w = games.slice(Math.max(0, i - 4), i + 1); return share(w.reduce((s, q) => s + q.xgf, 0), w.reduce((s, q) => s + q.xga, 0)); });
  if (games.length > 2) o.push(`<polyline fill="none" stroke="var(--t-fg)" stroke-width="1.5" points="${roll.map((v, i) => `${X(i).toFixed(1)},${(H - 14 - v * (H - 28)).toFixed(1)}`).join(" ")}" opacity=".7"/>`);
  o.push(`</svg>`);
  return o.join("");
}

/* ---------- team lenses ---------- */
/* Each lens plots one question about every team, splits the field into four
   quadrants at the league average (or 50% / zero where that's the natural
   line) and names them. q keys: x side then y side, h = the better side. */
const LENSES = {
  drive: { name:"Play-driving", desc:"5-on-5 chances created against chances allowed, per 60 minutes. The best single read of who controls play, and the most predictive of future results.",
    x:t => t["5v5"].xgf60, y:t => t["5v5"].xga60, flipY:true, fx:v => v.toFixed(2), fy:v => v.toFixed(2),
    xl:"5v5 xGF/60: chances created →", yl:"5v5 xGA/60: fewer allowed ↑",
    q:{ hh:["Dominant","create a lot, allow little"], lh:["Defensive","tight games, few chances either way"],
        hl:["Run & gun","trade chances"], ll:["Outplayed","chasing all night"] } },
  luck: { name:"Luck", desc:"Share of expected goals (the process) against share of actual goals (the results). Above the diagonal a team is scoring more than its chances say, from hot shooting or hot goaltending; below it, the bounces have gone the other way.",
    x:t => share(t.xgf, t.xga), y:t => share(t.gf_x, t.ga_x), mx:.5, my:.5, diag:true, fx:v => pct(v), fy:v => pct(v),
    xl:"xG share: share of chances →", yl:"Goal share ↑",
    q:{ hh:["Good & winning","earning it"], lh:["Riding luck","outscoring their chances"],
        hl:["Unlucky","better than the record"], ll:["Bad & losing","the record is fair"] } },
  finish: { name:"Finishing", desc:"Chances created per game against goals scored above or below those chances. Finishing runs hot and cold and tends to drift back toward zero.",
    x:t => t.xgf / t.gp, y:t => t.gax, my:0, fx:v => v.toFixed(2), fy:v => (v > 0 ? "+" : "") + v.toFixed(1),
    xl:"xGF per game: chances created →", yl:"GAx: goals above expected ↑",
    q:{ hh:["Create & finish","chances and the hands to bury them"], lh:["Opportunistic","few chances, cashing in"],
        hl:["Snakebitten","the chances are there, the goals aren't"], ll:["Starved","not much to finish"] } },
  save: { name:"Goaltending", desc:"Chances allowed per game against goals saved above expected. Right is fewer chances allowed; up is the goalies stopping more than an average one would.",
    x:t => t.xga / t.gp, flipX:true, y:t => t.gsax, my:0, fx:v => v.toFixed(2), fy:v => (v > 0 ? "+" : "") + v.toFixed(1),
    xl:"xGA per game: fewer allowed →", yl:"GSAx: goals saved above expected ↑",
    q:{ hh:["Locked down","few chances, and the goalie stops them"], lh:["Bailed out","leaky, but the goalie is standing on his head"],
        hl:["Leaky goalie","the defence holds, the goalie doesn't"], ll:["Sieve","chances against and nobody stopping them"] } },
};
const QCOL = { hh:"var(--t-good)", lh:"var(--t-warn)", hl:"var(--t-home)", ll:"var(--t-bad)" };

function lensChart(T, key){
  const L = LENSES[key];
  const pts = T.map(t => ({ t, x:L.x(t), y:L.y(t) })).filter(p => p.x != null && p.y != null && isFinite(p.x) && isFinite(p.y));
  if (!pts.length) return { svg:`<p class="note">Not enough games yet.</p>`, callouts:"" };
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const mx = L.mx ?? avg(pts.map(p => p.x)), my = L.my ?? avg(pts.map(p => p.y));
  const W = 560, H = 430, PL = 44, PR = 16, PT = 30, PB = 40;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  if (L.diag) { x0 = y0 = Math.min(x0, y0); x1 = y1 = Math.max(x1, y1); }
  const px = (x1 - x0) * .08 || .1, py = (y1 - y0) * .1 || .1;
  x0 -= px; x1 += px; y0 -= py; y1 += py;
  // keep the quadrant split inside the frame
  x0 = Math.min(x0, mx - px); x1 = Math.max(x1, mx + px); y0 = Math.min(y0, my - py); y1 = Math.max(y1, my + py);
  const X = v => { const f = (v - x0) / (x1 - x0); return PL + (L.flipX ? 1 - f : f) * (W - PL - PR); };
  const Y = v => { const f = (v - y0) / (y1 - y0); return PT + (L.flipY ? f : 1 - f) * (H - PT - PB); };
  const side = p => {
    const hx = L.flipX ? p.x < mx : p.x >= mx, hy = L.flipY ? p.y < my : p.y >= my;
    return (hx ? "h" : "l") + (hy ? "h" : "l");
  };
  const cx = X(mx), cy = Y(my);
  const o = [`<svg class="quad" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L.name)} chart">`];
  // quadrant tints and names
  const box = { lh:[PL, PT, cx, cy], hh:[cx, PT, W - PR, cy], ll:[PL, cy, cx, H - PB], hl:[cx, cy, W - PR, H - PB] };
  Object.entries(box).forEach(([k, [a, b, c, d]]) => {
    o.push(`<rect x="${a}" y="${b}" width="${c - a}" height="${d - b}" fill="${QCOL[k]}" opacity=".07"/>`);
    const right = k[0] === "h", top = k[1] === "h";
    o.push(`<text class="qlabel" x="${right ? c - 8 : a + 8}" y="${top ? b + 16 : d - 8}" text-anchor="${right ? "end" : "start"}" style="fill:${QCOL[k]}">${esc(L.q[k][0])}</text>`);
  });
  o.push(`<line x1="${cx}" x2="${cx}" y1="${PT}" y2="${H - PB}" stroke="var(--t-line)" stroke-dasharray="4 4"/>`);
  o.push(`<line y1="${cy}" y2="${cy}" x1="${PL}" x2="${W - PR}" stroke="var(--t-line)" stroke-dasharray="4 4"/>`);
  if (L.diag) {
    const d = x0 + (x1 - x0) * .62;
    o.push(`<line x1="${X(x0)}" y1="${Y(x0)}" x2="${X(x1)}" y2="${Y(x1)}" stroke="var(--t-muted)" stroke-width="1" opacity=".6"/>
      <text class="ax" x="${X(d) + 8}" y="${Y(d) + 16}">results = process</text>`);
  }
  o.push(`<text class="ax" x="${W - PR}" y="${H - 10}" text-anchor="end">${esc(L.xl)}</text>`);
  o.push(`<text class="ax" x="12" y="${PT + 4}" transform="rotate(-90 12 ${PT + 4})" text-anchor="end">${esc(L.yl)}</text>`);
  pts.forEach(p => {
    p.q = side(p);
    o.push(`<g class="tpt" data-team="${p.t.team}"><circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.2" fill="${QCOL[p.q]}" stroke="var(--t-card)" stroke-width="1"/>
      <text class="tm" x="${(X(p.x) + 6).toFixed(1)}" y="${(Y(p.y) + 3.5).toFixed(1)}">${p.t.team}</text></g>`);
  });
  o.push(`</svg>`);
  // callouts: each quadrant's teams, furthest from the split first
  const sx = (x1 - x0), sy = (y1 - y0);
  const callouts = ["hh", "hl", "lh", "ll"].map(k => {
    const g = pts.filter(p => p.q === k).sort((a, b) =>
      Math.hypot((b.x - mx) / sx, (b.y - my) / sy) - Math.hypot((a.x - mx) / sx, (a.y - my) / sy));
    return `<div class="callout" style="--q:${QCOL[k]}"><div class="h">${esc(L.q[k][0])} &middot; ${g.length}</div>
      <div class="muted">${esc(L.q[k][1])}</div><div class="qteams">${g.map(p => teamLink(p.t.team)).join(" ") || "&ndash;"}</div></div>`;
  }).join("");
  // Luck is distance from the diagonal, not just which quadrant a team sits in.
  let extra = "";
  if (L.diag) {
    const gap = pts.map(p => ({ p, g:p.y - p.x })).sort((a, b) => a.g - b.g);
    const row = (h, c, list) => `<div class="callout" style="--q:${c}"><div class="h">${h}</div><div>${list.map(({p, g}) =>
      `${teamLink(p.t.team)} <span class="muted">${g > 0 ? "+" : ""}${(g * 100).toFixed(1)}%</span>`).join(", ")}</div></div>`;
    extra = row("Unluckiest: goal share furthest below chance share", "var(--t-home)", gap.slice(0, 4))
          + row("Luckiest: goal share furthest above chance share", "var(--t-warn)", gap.slice(-4).reverse());
  }
  return { svg:o.join(""), callouts:extra + callouts, pts, L };
}

function bindLensTips(res){
  const tip = $("tip");
  document.querySelectorAll(".tpt").forEach(el => {
    const p = res.pts.find(q => q.t.team === el.dataset.team);
    el.onmousemove = e => {
      tip.innerHTML = `<b>${p.t.team}</b> &middot; ${esc(res.L.q[p.q][0])}<br>${esc(res.L.xl.split(":")[0])}: <b>${res.L.fx ? res.L.fx(p.x) : p.x}</b><br>
        ${esc(res.L.yl.split(":")[0])}: <b>${res.L.fy ? res.L.fy(p.y) : p.y}</b><br><span class="muted">${p.t.w}-${p.t.l}-${p.t.otl}, ${p.t.pts} pts &middot; click to open</span>`;
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 260) + "px"; tip.style.top = (e.clientY + 14) + "px";
    };
    el.onmouseleave = () => tip.style.display = "none";
    el.onclick = () => location.hash = "team/" + p.t.team;
  });
}

/* ---------- players ---------- */
function renderPlayers(){
  const st = UI.players;
  const goalies = st.kind === "goalies";
  const P = S.players[UI.phase];
  let rows = (goalies ? P.goalies : P.skaters).slice();
  if (st.team) rows = rows.filter(p => p.team === st.team);
  if (!goalies && st.pos) rows = rows.filter(p => st.pos === "D" ? p.pos === "D" : st.pos === "F" ? p.pos !== "D" : p.pos === st.pos);
  rows = rows.filter(p => (p.toi || 0) >= st.min * 60 && p.gp >= st.mingp);
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(p => p.name.toLowerCase().includes(q)); }
  const name = { k:"name", label:goalies?"Goalie":"Skater", l:true, get:p => p.name, asc:true, fmt:p => esc(p.name) };
  const team = { k:"team", label:"Team", l:true, get:p => p.team, asc:true, fmt:p => p.team ? teamLink(p.team) : "" };
  const cols = goalies ? [
    { k:"#", label:"#", cls:"rank" }, name, team,
    { k:"gp", label:"GP", get:p => p.gp, tip:"gp" },
    { k:"toi", label:"Min", get:p => p.toi, fmt:p => toiH(p.toi), tip:"toitot" },
    { k:"sa", label:"Shots", get:p => p.sa, tip:"sa" },
    { k:"ga", label:"GA", get:p => p.ga, asc:true, tip:"gaG" },
    { k:"xga", label:"xGA", get:p => p.xga, fmt:p => f1(p.xga), tip:"xgaG" },
    { k:"gsax", label:"GSAx", get:p => p.gsax, fmt:p => `<b>${signed(p.gsax)}</b>`, tip:"gsax" },
    { k:"gsax60", label:"GSAx/60", get:p => p.gsax60, fmt:p => signed(p.gsax60, 2), tip:"gsax60" },
    { k:"sv_pct", label:"Sv%", get:p => p.sv_pct, fmt:p => sv(p.sv_pct), tip:"svp" },
    { k:"xsv_pct", label:"xSv%", get:p => p.xsv_pct, fmt:p => sv(p.xsv_pct), tip:"xsvp" },
  ] : [
    { k:"#", label:"#", cls:"rank" }, name, team,
    { k:"pos", label:"Pos", l:true, get:p => posLabel(p.pos), asc:true, fmt:p => posLabel(p.pos) },
    { k:"gp", label:"GP", get:p => p.gp, tip:"gp" },
    { k:"toi", label:"TOI/GP", get:p => p.toi / p.gp, fmt:p => toi(p.toi / p.gp), tip:"toi" },
    { k:"g", label:"G", get:p => p.g, tip:"g" },
    { k:"a", label:"A", get:p => p.a ?? null, fmt:p => p.a ?? "&ndash;", tip:"a" },
    { k:"pts", label:"P", get:p => p.pts ?? null, fmt:p => `<b>${p.pts ?? "&ndash;"}</b>`, tip:"p" },
    { k:"ixg", label:"ixG", get:p => p.ixg, fmt:p => f1(p.ixg), tip:"ixg" },
    { k:"gax", label:"GAx", get:p => p.gax, fmt:p => signed(p.gax), tip:"gax" },
    { k:"att", label:"Att", get:p => p.att, tip:"att" },
    { k:"xgs", label:"xG share", get:p => p.xgf_pct ?? null, fmt:p => pct(p.xgf_pct), tip:"xgs" },
    { k:"xgs5", label:"5v5 xG share", get:p => p.xgf_pct5, fmt:p => pct(p.xgf_pct5), tip:"xgs5" },
    { k:"ixg60_5", label:"5v5 ixG/60", get:p => p.ixg60_5, fmt:p => f2(p.ixg60_5), tip:"ixg60" },
    { k:"xgf60_5", label:"5v5 xGF/60", get:p => p.xgf60_5, fmt:p => f2(p.xgf60_5), tip:"xgf60" },
    { k:"xga60_5", label:"5v5 xGA/60", get:p => p.xga60_5, fmt:p => f2(p.xga60_5), asc:true, tip:"xga60" },
  ];
  if (!cols.some(c => c.k === st.sort)) { st.sort = goalies ? "gsax" : "pts"; st.asc = false; }
  const sorted = sortRows(rows, cols, st);
  const opts = ['<option value="">All teams</option>'].concat(teamList().map(t => `<option ${t===st.team?"selected":""}>${t}</option>`)).join("");
  const posOpts = [["", "All"], ["F", "Forwards"], ["C", "C"], ["L", "LW"], ["R", "RW"], ["D", "D"]]
    .map(([v, l]) => `<option value="${v}" ${st.pos === v ? "selected" : ""}>${l}</option>`).join("");
  $("view").innerHTML = `
    <div class="filters">
      <div class="seg"><button data-k="skaters" aria-pressed="${!goalies}">Skaters</button><button data-k="goalies" aria-pressed="${goalies}">Goalies</button></div>
      ${phaseSeg(renderPlayers)}
      <label class="f">Team <select id="pTeam">${opts}</select></label>
      ${goalies ? "" : `<label class="f">Position <select id="pPos">${posOpts}</select></label>`}
      <label class="f">Min. games <select id="pGp">${[1, 5, 10, 20, 40].map(m => `<option ${m===st.mingp?"selected":""}>${m}</option>`).join("")}</select></label>
      <label class="f">Min. minutes <select id="pMin">${[0,100,300,600,1000].map(m => `<option ${m===st.min?"selected":""}>${m}</option>`).join("")}</select></label>
      <label class="f">Search <input id="pQ" type="search" placeholder="Name" value="${esc(st.q)}"></label>
      <span class="note">${sorted.length} ${goalies?"goalies":"skaters"}</span>
    </div>
    <div class="card">${table(sorted.slice(0, st.shown), cols, st, renderPlayers)}
      ${sorted.length > st.shown ? `<button class="btn more" id="pMore">Show more</button>` : ""}</div>
    <p class="note">${goalies
      ? "GSAx compares goals allowed with the xG of the unblocked shots a goalie faced. It needs a big sample: a full season of starts swings by ±5 on luck alone."
      : "Small samples mislead: a 20-shot sample of GAx is mostly noise. On-ice numbers credit everyone on the ice, so they reflect linemates and usage as much as the player."} Hover a heading for what it means.</p>`;
  document.querySelectorAll(".seg button[data-k]").forEach(b => b.onclick = () => { st.kind = b.dataset.k; st.shown = 100; renderPlayers(); });
  $("pTeam").onchange = e => { st.team = e.target.value; renderPlayers(); };
  if ($("pPos")) $("pPos").onchange = e => { st.pos = e.target.value; renderPlayers(); };
  $("pGp").onchange = e => { st.mingp = +e.target.value; renderPlayers(); };
  $("pMin").onchange = e => { st.min = +e.target.value; renderPlayers(); };
  $("pQ").oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; renderPlayers(); const i = $("pQ"); i.focus(); i.setSelectionRange(pos, pos); };
  if ($("pMore")) $("pMore").onclick = () => { st.shown += 200; renderPlayers(); };
}

/* ---------- model ---------- */
function renderModel(){
  const live = S.season === S.seasons[0];
  const g = S.index.games, xg = g.reduce((s, x) => s + x.hxg + x.axg, 0), goals = g.reduce((s, x) => s + x.hs + x.as - (x.end === "SO" ? 1 : 0), 0);  // a shootout win adds a goal nobody shot
  $("view").innerHTML = `
    <div class="card prose">
      <span class="eyebrow">How the xG model works</span>
      <div class="kv">
        <div class="tile"><div class="k">Trained on</div><div class="v">1.13M shots</div></div>
        <div class="tile"><div class="k">Seasons</div><div class="v">2015&ndash;2025</div></div>
        <div class="tile"><div class="k">${seasonLabel(S.season)} xG vs goals</div><div class="v">${xg.toFixed(0)} / ${goals}</div></div>
      </div>
      <p>Each unblocked shot gets a probability of becoming a goal, from a gradient-boosted model trained on every NHL shot since 2015-16 and built from the league's own play-by-play and shift charts, the same feed it scores after each game. A team's or player's xG is the sum of those probabilities.</p>
      <h3>What it looks at</h3>
      <p><b>The shot:</b> distance, angle, whether it came from behind the net, shot type, the shooter's handedness and wing. <b>The play before it:</b> what the previous event was, where, and how long ago; whether it's a rebound and off what (a save, a miss or a block); how fast the puck moved. <b>Game state:</b> strength (5v5, power play, pulled goalie and why), score, period, time. <b>Fatigue:</b> how long the shooter and both units had been on the ice.</p>
      <h3>What it can't see</h3>
      <p>The public feed doesn't log passes or zone entries, so <b>cross-ice feeds and true rushes are invisible</b>. The model uses proxies: seconds since the puck was last outside the zone, since the team won it, and whether the puck crossed the middle. They help a little. Screens, traffic, shot speed and where the shot was aimed aren't in the data at all.</p>
      <h3>How good it is</h3>
      <div class="tw"><table>
        <thead><tr><th class="l">Held-out season</th><th>AUC</th><th>Log loss</th><th>xG / goals</th></tr></thead>
        <tbody>
          <tr><td class="l">2024-25 (ours)</td><td>0.767</td><td>0.2206</td><td>1.005</td></tr>
          <tr><td class="l">2025-26 (ours)</td><td>0.757</td><td>0.2264</td><td>1.062</td></tr>
          <tr><td class="l muted">2025-26 (MoneyPuck)</td><td class="muted">0.777</td><td class="muted">0.2226</td><td class="muted">1.004</td></tr>
          <tr><td class="l">2026-27 so far (served model)</td><td>0.776</td><td>0.2246</td><td>1.002</td></tr>
        </tbody></table></div>
      <p style="margin-top:10px"><b>AUC</b> is how well it ranks dangerous shots over safe ones (0.5 is a coin flip). <b>xG / goals</b> is whether the totals are right: 1.00 is perfect. The held-out rows were trained only through 2022-23 and never saw those seasons. MoneyPuck, the best-known public model, still ranks individual shots a little better; our inputs match theirs almost exactly, so the gap is in the modelling.</p>
      <h3>Caveats</h3>
      <p><b>The league's logging drifts.</b> A shot within three seconds of another was 4% of non-goals in 2015 and 10% in 2025. The model weights recent seasons more and is recalibrated on the latest complete season, but it still slips a few percent a year, so it gets refit each summer.</p>
      <p><b>2025-26 numbers here are partly in-sample:</b> the served model was calibrated on that season, so its xG totals match goals by construction. ${live ? "This season's games are fully out of sample." : ""}</p>
      <p><b>Blocked shots</b> count as attempts but carry no xG; their coordinates are where they were blocked, not where they were taken.</p>
    </div>`;
}

/* ---------- boot ---------- */
async function boot(){
  try {
    const { seasons } = await (await fetch(BASE + "seasons.json", {cache:"no-store"})).json();
    S.seasons = seasons;
    const want = +new URLSearchParams(location.search).get("season") || seasons[0];
    $("season").innerHTML = seasons.map(s => `<option value="${s}" ${s===want?"selected":""}>${seasonLabel(s)}</option>`).join("");
    $("season").onchange = async e => {
      const u = new URL(location); u.searchParams.set("season", e.target.value); history.replaceState(null, "", u);
      await loadSeason(+e.target.value);
      if (location.hash.startsWith("#game/")) location.hash = "games"; else route();
    };
    await loadSeason(seasons.includes(want) ? want : seasons[0]);
    addEventListener("hashchange", route);
    route();
  } catch (e) {
    $("view").innerHTML = `<div class="card"><p class="note">No game sheets published yet. They appear after the first nightly run.</p></div>`;
  }
}
{ const l = new URLSearchParams(location.search).get("lens"); if (LENSES[l]) UI.teams.lens = l; }
boot();
</script>
