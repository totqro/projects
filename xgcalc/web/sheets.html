<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Game Sheets moved to Fort Knox</title>
<link rel="canonical" href="https://fortknox-hockey.web.app/">
<script>
/* The game sheets moved to Fort Knox. Old links used hash routes
   (#game/<id>, #team/<abbrev>, #teams, #players, #model) and ?season=;
   send each to the same view there. */
(function () {
  var SITE = "https://fortknox-hockey.web.app";
  var q = new URLSearchParams(location.search);
  var now = new Date();
  // NHL seasons start in the autumn: before September is last year's season.
  var season = +q.get("season") || (now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1);
  var h = location.hash.replace(/^#/, "").split("/");
  var to = "/";
  if (h[0] === "game" && /^\d+$/.test(h[1])) to = "/game/" + h[1];
  else if (h[0] === "team" && /^[A-Z]{3}$/.test(h[1])) to = "/team/" + season + "/" + h[1];
  else if (h[0] === "teams") to = "/teams/" + season;
  else if (h[0] === "players") to = "/players/" + season;
  else if (h[0] === "model") to = "/model";
  else if (q.get("season")) to = "/games/" + season;
  location.replace(SITE + to);
})();
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e0e; color: #fff;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding: 16px; }
  a { color: #e6c66e; }
</style>
</head>
<body>
  <p>The game sheets moved to <a href="https://fortknox-hockey.web.app/">Fort Knox</a>.</p>
</body>
</html>
