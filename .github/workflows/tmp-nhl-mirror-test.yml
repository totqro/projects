name: TEMP NHL MoneyPuck mirror test

# Temporary: exercises the MoneyPuck download on GitHub's runners on a day
# with no NHL games. Delete after it passes.
on:
  push:
    branches: [claude/sweet-heisenberg-6hz9ni]
    paths: ['.github/workflows/tmp-nhl-mirror-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: nhllines/requirements.txt
      - run: pip install -r nhllines/requirements.txt scipy
      - run: mkdir -p nhllines/data nhllines/ml_models nhllines/cache

      - name: Serving path (what main.py runs on game days)
        working-directory: nhllines
        run: |
          python - <<'EOF'
          from src.data.moneypuck_data import load_moneypuck_xg
          from src.data.historical_dataset import MONEYPUCK_SEASONS
          from src.models import xg_production as xp

          for s in sorted(MONEYPUCK_SEASONS):
              n = len(load_moneypuck_xg([s]))
              print(f"{s}: {n} games with xG")
              assert n >= 1200, f"{s} only has {n} games"

          state = xp.get_live_feature_state()
          print(f"live state: {len(state['team_states'])} team-seasons, "
                f"current season {state['current_season']}, as of {state['as_of_date']}")

          assert xp.production_model_exists(), "shipped xG model missing"
          coefs, cal = xp.load_production_model()
          for home, away in [("TOR", "MTL"), ("EDM", "CGY"), ("NYR", "BOS"), ("COL", "VGK")]:
              f = xp.compute_serving_features(state, home, away, 2, 2, False, False)
              p, raw = xp.predict_calibrated(coefs, cal, f)
              print(f"{away} @ {home}: P(home win) = {p:.3f} (raw {raw:.3f})")
              assert 0.2 < p < 0.8, f"implausible prediction {p}"
          print("SERVING PATH OK")
          EOF

      - name: Training set build (weekly refit's data path, no goalies, no refit)
        working-directory: nhllines
        run: |
          python - <<'EOF'
          from src.data.historical_dataset import build_training_set
          from src.models.calibration import DEFAULT_SEASONS
          rows = build_training_set(DEFAULT_SEASONS, min_gp=5,
                                    out_path="/tmp/training_set.csv", with_goalies=False)
          print(f"{len(rows)} training rows")
          assert len(rows) > 4000, "training set too small"
          with_xg = sum(1 for r in rows if float(r.get("home_xgf_per60") or 0) > 0)
          print(f"{with_xg} rows with non-zero home xGF/60")
          assert with_xg > len(rows) * 0.9, "xG features missing from most rows"
          print("TRAINING PATH OK")
          EOF
