name: xG Game Sheets

# After every NHL game: fetch newly final games, score every shot with the
# full-data xG model, rebuild the season's game sheets and team/player tables,
# and redeploy. While games are on, it also scores them so far (live/), so
# each run during a game redeploys. Quiet runs change nothing.
#
# The output is not committed to main (a season is ~1,400 files, rewritten
# nightly). It is force-pushed as a single commit to the orphan branch
# xg-sheets-data, which fortknox-deploy.yml builds the High Slot site from.
# Force-push keeps that branch one commit deep, so it never grows the repo's
# history.

on:
  schedule:
    # Every 20 minutes from noon to 4am ET (16:00-07:59 UTC): matinees end
    # around 3-6pm ET, late West games around 1am ET. GitHub often starts
    # scheduled runs late, so expect sheets 20-60 minutes after the final horn.
    # Off the hour (:07/:27/:47): GitHub drops the most scheduled runs at :00.
    - cron: '7,27,47 16-23,0-7 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season start year (blank = current)'
        required: false
      force:
        description: 'Rebuild and deploy even if no new games'
        type: boolean
        default: false

concurrency:
  group: xg-game-sheets
  cancel-in-progress: false

jobs:
  sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push xg-sheets-data
      actions: write    # dispatch deploy.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: fortknox/pipeline/requirements.txt

      - run: pip install -r fortknox/pipeline/requirements.txt

      - name: Pick season
        id: season
        working-directory: fortknox/pipeline
        run: |
          S="${{ github.event.inputs.season }}"
          [ -z "$S" ] && S=$(python -c "from nhl_sheets import current_season; print(current_season())")
          echo "season=$S" >> $GITHUB_OUTPUT
          echo "Season $S"

      # The raw feed for this season, so a run fetches only what's new. A
      # final game never changes; the cache only ever grows. (The cache's
      # version follows its path, so the first run after the pipeline moved
      # out of xgcalc/ refetches the season once.)
      - name: Restore raw NHL cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: fortknox/pipeline/cache/nhl/${{ steps.season.outputs.season }}
          key: nhl-raw-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: nhl-raw-${{ steps.season.outputs.season }}-

      - name: Fetch newly final games
        id: fetch
        working-directory: fortknox/pipeline
        run: |
          S=${{ steps.season.outputs.season }}
          sig() { find cache/nhl/$S -type f 2>/dev/null -printf '%f %s\n' | sort | md5sum; }
          before=$(sig)
          python nhl_backfill.py --seasons $S --refresh-bios
          after=$(sig)
          if [ "$before" != "$after" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new games or shift charts."
          fi

      - name: Save raw NHL cache
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: fortknox/pipeline/cache/nhl/${{ steps.season.outputs.season }}
          key: nhl-raw-${{ steps.season.outputs.season }}-${{ github.run_id }}

      # Start from what's published so earlier seasons stay on the site (and
      # tonight's live games can be checked against the sheets already out).
      - name: Load published sheets
        run: |
          # A clone, not a fetch into the checkout: a quiet fetch that failed
          # here once dropped every earlier season from the site. If the branch
          # exists, reading it must succeed or the run stops.
          REPO="https://github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO" xg-sheets-data > /dev/null; then
            git clone -q --depth 1 --branch xg-sheets-data "$REPO" "$RUNNER_TEMP/prev"
            rm -rf "$RUNNER_TEMP/prev/.git"
            mv "$RUNNER_TEMP/prev" "$RUNNER_TEMP/sheets"
            echo "Starting from published seasons: $(cat "$RUNNER_TEMP/sheets/seasons.json")"
          else
            mkdir -p "$RUNNER_TEMP/sheets"
            echo "No xg-sheets-data branch yet; starting empty."
          fi

      # Only this season's folder is rebuilt.
      - name: Build game sheets
        if: steps.fetch.outputs.changed == 'true'
        working-directory: fortknox/pipeline
        run: |
          rm -rf "$RUNNER_TEMP/sheets/${{ steps.season.outputs.season }}"
          python nhl_sheets.py --season ${{ steps.season.outputs.season }} --no-fetch --out "$RUNNER_TEMP/sheets"

      # Tonight's games in progress, and finished ones still waiting on their
      # official sheet, scored so far into live/ (nhl_live.py). After the
      # build, so a game that just got its sheet leaves live/ in the same run.
      # Never holds up the rest: on any error live/ is left as published.
      - name: Score live games
        id: live
        if: github.event.inputs.season == ''
        continue-on-error: true
        working-directory: fortknox/pipeline
        run: python nhl_live.py --sheets "$RUNNER_TEMP/sheets"

      - name: Publish to xg-sheets-data
        if: steps.fetch.outputs.changed == 'true' || steps.live.outputs.changed == 'true'
        run: |
          cd "$RUNNER_TEMP/sheets"
          test -s seasons.json
          git init -q -b xg-sheets-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "xG game sheets, season ${{ steps.season.outputs.season }} [$(date -u +'%Y-%m-%d %H:%M')]"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" xg-sheets-data
          echo "Published seasons: $(cat seasons.json)"

      # The home page's "Tonight" strip is fetched at deploy time
      # (fortknox/scripts/fetch-tonight.mjs), so redeploy when the slate
      # changes even with no new sheets: a new day, a puck drop, a final. The
      # last slate seen is kept in the cache; an NHL API error changes nothing.
      - name: Restore last slate
        uses: actions/cache/restore@v4
        with:
          path: .slate
          key: tonight-slate-${{ github.run_id }}
          restore-keys: tonight-slate-

      - name: Check tonight's slate
        id: slate
        run: |
          now=$(node fortknox/scripts/fetch-tonight.mjs --sig 2>/dev/null || true)
          last=$(cat .slate/sig 2>/dev/null || true)
          echo "Slate: ${now:-unavailable}"
          if [ -n "$now" ] && [ "$now" != "$last" ]; then
            mkdir -p .slate && echo "$now" > .slate/sig
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save slate
        if: steps.slate.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .slate
          key: tonight-slate-${{ github.run_id }}

      # A push made with GITHUB_TOKEN doesn't trigger other workflows, but a
      # workflow_dispatch does.
      - name: Redeploy High Slot
        if: steps.fetch.outputs.changed == 'true' || steps.slate.outputs.changed == 'true' || steps.live.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fortknox-deploy.yml --ref main
