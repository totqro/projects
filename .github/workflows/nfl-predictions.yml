name: NFL Predictions

# Logs pre-game NFL predictions (nfllines/) once each game's FINAL injury
# report is out, and commits them to nfllines/data/predictions_log.jsonl —
# the season record the scorecard grades. predict.py decides what is ready
# (src/readiness.py): a game is logged only after its final report deadline
# (4 pm ET the day before a Thursday game, two days before any other) and
# only before kickoff. Every run is safe to repeat: games not ready are
# printed with the reason and skipped; a game logged on several days is
# scored on its last pre-kickoff row.
on:
  schedule:
    # UTC. ET = UTC-4 until Nov 1, UTC-5 after.
    # GitHub starts scheduled runs late: 2-3 hours on weekday evenings and
    # 4.5 hours on Sunday morning in Sept 2026 (a 6pm ET Thursday run
    # started at 8:12pm, 3 minutes before kickoff). So every deadline gets
    # runs set early enough to land in time even 3-4 hours late, minutes
    # are off the congested :00, and each game has more than one chance.
    # Extra runs are harmless: a game not ready is skipped, a game is logged
    # once per day, and the last pre-kickoff row is the one scored.
    - cron: '17 21 * * 2'  # Tue  5:17pm ET: Wednesday games (Christmas)
    - cron: '17 21 * * 3'  # Wed  5:17pm ET: Thursday game (report due Wed 4pm)
    - cron: '17 13 * * 4'  # Thu  9:17am ET: Thursday game retry
    - cron: '17 18 * * 4'  # Thu  2:17pm ET: Thursday retry; Saturday games (report due Thu 4pm)
    - cron: '47 20 * * 4'  # Thu  4:47pm ET: last Thursday retry, lands by ~8pm if 3h late
    - cron: '17 21 * * 5'  # Fri  5:17pm ET: Sunday games (report due Fri 4pm)
    - cron: '17 13 * * 6'  # Sat  9:17am ET: Sunday games retry
    - cron: '17 21 * * 6'  # Sat  5:17pm ET: Monday games (report due Sat 4pm); Sunday retry
    - cron: '17 5 * * 0'   # Sun  1:17am ET: last Sunday retry, lands before London 9:30am
    - cron: '17 11 * * 0'  # Sun  7:17am ET: Sunday 1pm games, Monday retry
    - cron: '17 13 * * 1'  # Mon  9:17am ET: scores Sunday on the website; Monday retry
  workflow_dispatch:
  # On a PR: the same run, dry (nothing logged or committed), plus the tests.
  pull_request:
    paths:
      - 'nfllines/**'
      - '.github/workflows/nfl-predictions.yml'

concurrency:
  group: nfl-predictions-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: nfllines

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: nfllines/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Completed seasons of play-by-play, snaps, rosters and injuries never
      # change, so they are cached across runs. The current season is always
      # re-downloaded by the code itself (src/data/nflverse.py), whatever is
      # in this cache.
      - name: Restore nflverse season cache
        uses: actions/cache@v4
        with:
          path: |
            nfllines/data/processed/pbp
            nfllines/data/processed/snaps
            nfllines/data/processed/rosters_weekly
            nfllines/data/processed/injuries
          key: nflverse-seasons-v1-${{ github.run_id }}
          restore-keys: nflverse-seasons-v1-

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: python -m pytest tests -q

      # nflverse's release files are occasionally unavailable for a few
      # minutes (a 404 on schedules/games.parquet at 7:45pm ET on 2026-10-01,
      # 30 minutes before kickoff). A failed run logs nothing, so retry.
      - name: Predict
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then flags="--no-log"; fi
          ok=0
          for attempt in 1 2 3; do
            if python predict.py $flags --features-out served_features.csv > predict.raw 2>&1; then ok=1; break; fi
            echo "::warning::predict.py failed (attempt $attempt of 3); retrying in 2 minutes"
            tail -n 3 predict.raw
            [ "$attempt" = 3 ] || sleep 120
          done
          grep -v Warning predict.raw | tee predict.out || true
          {
            echo "### NFL predictions ($([ -n "$flags" ] && echo 'dry run' || echo 'logged'))"
            echo '```'
            cat predict.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]

      # The exact feature rows behind this run's predictions, kept 90 days:
      # the audit trail for any live-vs-training discrepancy.
      - name: Upload served features
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: served-features-${{ github.run_id }}
          path: nfllines/served_features.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: Season scorecard
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python scorecard.py --season "$(python -c 'from src.data.nflverse import current_season; print(current_season())')" 2>&1 \
            | grep -v Warning > scorecard.out || true
          { echo "### Season scorecard"; echo '```'; cat scorecard.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The website's data (lknox.web.app/nfllines): this week's games and the
      # season scorecard. Deploy to Firebase chains off this workflow.
      - name: Export web data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python export_web.py 2>&1 | grep -v Warning

      - name: Commit prediction log
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfllines/data/predictions_log.jsonl nfllines/data/latest_analysis.json nfllines/data/performance.json
          if git diff --cached --quiet; then
            echo "No new predictions or web data to commit"
            exit 0
          fi
          git commit -m "chore: NFL predictions [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # The log is append-only and no other job touches it or the web JSON,
          # so a rebase onto the other bots' data commits cannot conflict. Retry on a push race.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && {
              echo "✅ Predictions and web data committed and pushed"
              exit 0
            }
            echo "::warning::Push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push the prediction log after 3 attempts"
          exit 1

      - name: Notify on failure
        # A missed run before kickoff is a permanent hole in the season record.
        if: failure() && github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ NFL Predictions Failed"
          to: lucknox@icloud.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            The NFL predictions workflow failed. Predictions are only valid if
            logged before kickoff, so check whether the next scheduled run
            (or a manual run) will still land in time.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}
        continue-on-error: true
