name: NHL Market Benchmark Snapshot

# Archives the betting market's devigged consensus probabilities before puck
# drop. This is the benchmark the prediction model is scored against in the
# Jan/Apr 2027 scorecards — and it is strictly perishable: a snapshot not
# taken before a game cannot be reconstructed afterwards.
on:
  schedule:
    # 3x daily, US/Eastern (offsets are EST; the NHL season is EST except
    # mid-March onward, when these land an hour later in local time):
    #   14:00 UTC =  9:00 ET  — opening lines
    #   20:00 UTC = 15:00 ET  — midday move
    #   23:30 UTC = 18:30 ET  — closest to puck drop (most games 19:00-19:30 ET)
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport key: icehockey_nhl, or baseball_mlb to smoke-test in the NHL off-season'
        type: string
        default: 'icehockey_nhl'

# Never let two snapshot runs race each other to push; a queued run still
# takes its own snapshot afterwards.
concurrency:
  group: nhl-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: nhllines/requirements.txt

      - name: Install dependencies
        run: pip install -r nhllines/requirements.txt

      - name: Take market snapshot
        working-directory: nhllines
        # Odds come from ESPN's keyless scoreboard (src/data/espn_odds.py), so
        # this job needs no Odds API key and cannot run out of credits.
        # --skip-empty: the schedule runs year-round, so an off-season or dark
        # day writes nothing rather than committing a zero-game file.
        run: python scripts/snapshot_market.py --sport "${{ inputs.sport || 'icehockey_nhl' }}" --skip-empty

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nhllines/data/market_snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new snapshot to commit (empty odds board — expected off-season)"
            exit 0
          fi
          git commit -m "chore: NHL market snapshot [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # Snapshots are new files only — never edits to existing ones — so a
          # rebase onto concurrent data commits from the daily analysis job
          # cannot conflict. Retry a few times in case of a push race.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && {
              echo "✅ Snapshot committed and pushed"
              exit 0
            }
            echo "::warning::Push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push market snapshot after 3 attempts"
          exit 1

      - name: Notify on failure
        # At most one mail per day, plus every manual run. The job fires 3x
        # daily and the usual causes — an outage, a changed feed — persist
        # across all three, so mailing per run is noise, not signal.
        if: failure() && (github.event_name != 'schedule' || github.event.schedule == '0 14 * * *')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ NHL Market Snapshot Failed"
          to: lucknox@icloud.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            The NHL market benchmark snapshot failed — this data is perishable,
            so a missed run is a permanent gap in the season benchmark.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}

            An empty board is NOT a failure — it exits clean. This mail means
            the fetch from ESPN's public scoreboard itself broke (an outage,
            or ESPN changed the feed's shape: see src/data/espn_odds.py).
        continue-on-error: true
