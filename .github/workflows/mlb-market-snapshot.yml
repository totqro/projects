name: MLB Market Benchmark Snapshot

# Archives the betting market's devigged consensus probabilities before first
# pitch — the benchmark an MLB prediction model should eventually be scored
# against, same rationale as the NHL snapshot job. Strictly perishable: a
# snapshot not taken before a game cannot be reconstructed afterwards.
on:
  schedule:
    # 3x daily, US/Eastern (offsets are EDT — the MLB season runs Apr-Oct,
    # entirely within US daylight time):
    #   13:00 UTC =  9:00 ET — opening lines
    #   17:00 UTC = 13:00 ET — covers day games (many MLB games start ~13:00-16:00 ET)
    #   22:30 UTC = 18:30 ET — closest to first pitch for night games (most start 19:00-19:15 ET)
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

# Never let two snapshot runs race each other to push; a queued run still
# takes its own snapshot afterwards.
concurrency:
  group: mlb-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: mlblines/requirements.txt

      - name: Install dependencies
        run: pip install -r mlblines/requirements.txt

      - name: Create config from secrets
        working-directory: mlblines
        run: |
          cat > config.json << 'EOF'
          {
            "odds_api_key": "${{ secrets.ODDS_API_KEY }}",
            "odds_api_key_two": "${{ secrets.ODDS_API_KEY_TWO }}",
            "odds_api_key_three": "${{ secrets.ODDS_API_KEY_THREE }}"
          }
          EOF

      - name: Take market snapshot
        working-directory: mlblines
        # --skip-empty: the schedule runs year-round, so an off-season or dark
        # day writes nothing rather than committing a zero-game file. The
        # script preflights the board via /events, which the Odds API bills at
        # 0 credits, so an empty slate is a clean no-op and not a failed run.
        run: |
          set +e
          python scripts/snapshot_market.py --skip-empty
          status=$?
          set -e
          # Exit 2 means every key was rejected — quota exhaustion or a stale
          # secret. Name it, because the bare 401 does not say which.
          if [ "$status" -eq 2 ]; then
            echo "::error::Every Odds API key was rejected. Regenerate at https://the-odds-api.com and update the ODDS_API_KEY / ODDS_API_KEY_TWO / ODDS_API_KEY_THREE repository secrets."
          fi
          exit $status

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlblines/mlbdata/market_snapshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new snapshot to commit (empty odds board — expected off-season)"
            exit 0
          fi
          git commit -m "chore: MLB market snapshot [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          # Snapshots are new files only — never edits to existing ones — so a
          # rebase onto concurrent data commits from the daily analysis job
          # cannot conflict. Retry a few times in case of a push race.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && {
              echo "✅ Snapshot committed and pushed"
              exit 0
            }
            echo "::warning::Push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push market snapshot after 3 attempts"
          exit 1

      - name: Notify on failure
        # At most one mail per day, plus every manual run. The job fires 3x
        # daily and the usual causes — a dead key, an API outage — persist
        # across all three, so mailing per run is noise, not signal.
        if: failure() && (github.event_name != 'schedule' || github.event.schedule == '0 13 * * *')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ MLB Market Snapshot Failed"
          to: lucknox@icloud.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            The MLB market benchmark snapshot failed — this data is perishable,
            so a missed run is a permanent gap in the season benchmark.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}

            An empty board is NOT a failure — it exits clean. This mail means
            the fetch itself broke; if the log says every key was rejected,
            the ODDS_API_KEY* repository secrets need regenerating.
        continue-on-error: true
