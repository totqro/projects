name: Daily NHL Game Predictions

on:
  schedule:
    # Run at 12:00 PM EST (17:00 UTC) every day
    - cron: '0 17 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_weekly_refit:
        description: 'Run the weekly training-set rebuild + model refit regardless of day (manual catch-up / testing)'
        type: boolean
        default: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: nhllines/requirements.txt

      - name: Install dependencies
        run: pip install -r nhllines/requirements.txt scipy

      - name: Create config from secrets
        working-directory: nhllines
        run: |
          cat > config.json << 'EOF'
          {
            "odds_api_key": "${{ secrets.ODDS_API_KEY }}",
            "odds_api_key_two": "${{ secrets.ODDS_API_KEY_TWO }}",
            "odds_api_key_three": "${{ secrets.ODDS_API_KEY_THREE }}"
          }
          EOF

      # The shipped model artifacts are committed (nhllines/ml_models/*.json),
      # so checkout restores them. There is deliberately no download-artifact
      # step: it can only see artifacts from its OWN run, so the old restore
      # failed on every run for months behind continue-on-error, and every run
      # started with no model at all.

      - name: Create required directories
        run: mkdir -p nhllines/data nhllines/ml_models nhllines/cache

      - name: Check for games today
        id: check-games
        working-directory: nhllines
        run: |
          GAME_COUNT=$(python -c "
          from src.data import fetch_todays_games
          print(len(fetch_todays_games()))
          ")
          echo "Games today: $GAME_COUNT"
          if [ "$GAME_COUNT" -gt "0" ]; then
            echo "has_games=true" >> $GITHUB_OUTPUT
          else
            echo "has_games=false" >> $GITHUB_OUTPUT
            echo "No NHL games scheduled today, skipping analysis"
          fi

      - name: Check day of week
        id: check-day
        run: |
          if [ "$(date +%u)" == "7" ]; then
            echo "is_sunday=true" >> $GITHUB_OUTPUT
          else
            echo "is_sunday=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild training set + refit production models (weekly)
        if: steps.check-day.outputs.is_sunday == 'true' || github.event.inputs.force_weekly_refit == 'true'
        working-directory: nhllines
        run: python build_training_set.py

      # main.py falls back to Elo when the gated xG artifacts are absent. That
      # fallback exists for local runs, not for production: here the artifacts
      # are committed, so their absence means something is actually wrong and
      # a silent downgrade to a weaker model is the worst outcome. Fail first.
      - name: Verify the shipped model artifacts are present
        if: steps.check-games.outputs.has_games == 'true'
        working-directory: nhllines
        run: |
          missing=""
          for f in xg_coefficients.json xg_calibrator.json; do
            if [ ! -f "ml_models/$f" ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Gated xG model artifacts missing:$missing"
            echo "These are committed to the repo (nhllines/ml_models/*.json)."
            echo "If they are gone, either the commit was reverted or the weekly"
            echo "refit wrote nothing. Serving would silently fall back to Elo."
            exit 1
          fi
          echo "✅ xG model artifacts present — serving the gated model."

      - name: Run NHL analysis
        if: steps.check-games.outputs.has_games == 'true'
        working-directory: nhllines
        run: python main.py --stake 0.50 --conservative

      - name: Check and update game results (30-day lookback)
        if: steps.check-games.outputs.has_games == 'true'
        working-directory: nhllines
        run: |
          python -c "
          from src.analysis.bet_tracker import check_results
          check_results(days_back=30)
          "

      - name: Update model feedback system
        if: steps.check-games.outputs.has_games == 'true'
        working-directory: nhllines
        run: |
          python -c "
          from src.analysis.model_feedback import update_model_from_results
          print('Updating model feedback with latest results...')
          update_model_from_results()
          "

      - name: Refresh backtest results (weekly)
        if: steps.check-day.outputs.is_sunday == 'true' || github.event.inputs.force_weekly_refit == 'true'
        working-directory: nhllines
        run: python backtest.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # predictions_log.jsonl is the season-validation record: it is
          # appended on an ephemeral runner, so a run's predictions exist only
          # if this commit captures them. It is also what makes the log's
          # same-day dedup work at all — checkout restores prior runs' lines.
          #
          # Added one at a time, and only if present: `git add` aborts without
          # staging ANYTHING when a single pathspec doesn't match, and the
          # prediction log doesn't exist until a run with games writes it — a
          # bare list would silently stop committing the other data files on
          # every gameless day.
          for f in bet_results.json analysis_history.json latest_analysis.json \
                   model_feedback.json backtest_results.json predictions_log.jsonl; do
            if [ -f "nhllines/data/$f" ]; then
              git add "nhllines/data/$f"
            fi
          done
          # The weekly refit rewrites these; committing them is what makes the
          # refit outlive the runner. Without this the refit is pointless on
          # every day but the one it runs.
          for f in xg_coefficients.json xg_calibrator.json elo_coefficients.json calibrator.json; do
            if [ -f "nhllines/ml_models/$f" ]; then
              git add "nhllines/ml_models/$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update NHL data [$(date +'%Y-%m-%d %H:%M')]"
            git pull --rebase origin main || {
              echo "::warning::Rebase failed, trying merge strategy"
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main
            }
            git push
            echo "✅ NHL data committed and pushed"
          fi

      # No upload-artifact step: the model is committed above. The old one
      # wrote an artifact after every run that nothing could ever read back.

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ NHL Predictions Failed"
          to: lucknox@icloud.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            The Daily NHL Game Predictions workflow failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}
            Time: ${{ github.event.head_commit.timestamp || 'manual' }}
        continue-on-error: true  # Don't fail the whole job if email fails
